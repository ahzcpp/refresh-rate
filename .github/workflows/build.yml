          # ── RootUtils.java（重构：全新多层融合注入方案，支持超频，解决闪退死锁） ──
          cat > app/src/main/java/com/pmahz/util/RootUtils.java << 'EOF'
          package com.pmahz.util;
          import android.util.Log;
          import java.io.*;

          public class RootUtils {
              private static final String TAG = "RootUtils";

              public static boolean isRooted() {
                  Process p = null;
                  DataOutputStream os = null;
                  BufferedReader r = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("echo RootOK\nexit\n");
                      os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line = r.readLine();
                      return "RootOK".equals(line);
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(r != null) r.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }

              /**
               * 高级多重全局注入切换法 - 完美适配超频面板，剔除导致锁死120Hz的Binder硬编码
               */
              public static boolean setRefreshRate(int width, int height, int hz) {
                  Process p = null;
                  DataOutputStream os = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());

                      // 1. 先清除系统可能存在的历史首选限制，释放屏幕频宽
                      os.writeBytes("cmd display clear-user-preferred-display-mode\n");

                      // 2. 核心：通过系统硬件大通配服务，依据物理长宽与目标赫兹强制匹配超频表
                      os.writeBytes("cmd display set-user-preferred-display-mode " + width + " " + height + " " + hz + ".0\n");
                      os.writeBytes("cmd display set-user-preferred-display-mode " + width + " " + height + " " + hz + "\n");

                      // 3. 强力改写系统设置层全局框架参数 (浮点与整型双轨并进)
                      os.writeBytes("settings put system peak_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put system min_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put system peak_refresh_rate " + hz + "\n");
                      os.writeBytes("settings put system min_refresh_rate " + hz + "\n");
                      
                      // 4. 彻底改写主流大厂（小米、OPPO等）独立加入的私有帧率锁机制
                      os.writeBytes("settings put system user_refresh_rate " + hz + "\n");
                      os.writeBytes("settings put secure user_refresh_rate " + hz + "\n");
                      os.writeBytes("settings put secure miui_refresh_rate " + hz + "\n");
                      os.writeBytes("settings put secure refresh_rate_mode 2\n");

                      // 5. 激发硬件渲染器重构更新
                      os.writeBytes("setprop persist.sys.sf.hs_mode " + hz + "\n");
                      os.writeBytes("setprop persist.vendor.power.remis " + hz + "\n");

                      os.writeBytes("exit\n");
                      os.flush();
                      p.waitFor();
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "刷新率底层配置写入异常: " + e.getMessage());
                      return false;
                  } finally {
                      // 严密封闭底层管道，阻止进程死锁以及引发应用闪退
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }
          }
          EOF

          # ── RateAdapter.java（单列大卡片，大大的绿色对勾 ✔ 当前） ──
          cat > app/src/main/java/com/pmahz/adapter/RateAdapter.java << 'EOF'
          package com.pmahz.adapter;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.*;
          import android.view.animation.AnimationUtils;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;
          import androidx.recyclerview.widget.RecyclerView;
          import com.pmahz.R;
          import com.pmahz.model.DisplayMode;
          import java.util.List;

          public class RateAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              public static final int TYPE_HEADER = 0, TYPE_RATE = 1;
              public interface OnRateClick { void onClick(DisplayMode m); }
              private List<Object> items;
              private Context ctx;
              private OnRateClick listener;
              private DisplayMode current;

              public RateAdapter(Context c, List<Object> i, OnRateClick l) { ctx=c; items=i; listener=l; }
              public void update(List<Object> i) { items=i; notifyDataSetChanged(); }
              public void setCurrent(DisplayMode m) { current=m; notifyDataSetChanged(); }
              @Override public int getItemViewType(int p) { return items.get(p) instanceof String ? TYPE_HEADER : TYPE_RATE; }
              @Override public int getItemCount() { return items==null ? 0 : items.size(); }

              @Override public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                  LayoutInflater inf = LayoutInflater.from(ctx);
                  if (t == TYPE_HEADER) return new HVH(inf.inflate(R.layout.item_res_header, p, false));
                  return new RVH(inf.inflate(R.layout.item_rate_card, p, false));
              }

              @Override public void onBindViewHolder(RecyclerView.ViewHolder h, int pos) {
                  // 加载优雅位移淡入动效
                  h.itemView.startAnimation(AnimationUtils.loadAnimation(ctx, R.anim.item_animation));
                  
                  if (getItemViewType(pos) == TYPE_HEADER) {
                      ((HVH) h).title.setText((String) items.get(pos));
                  } else {
                      DisplayMode m = (DisplayMode) items.get(pos);
                      RVH r = (RVH) h;
                      r.name.setText(m.getRateName());
                      r.hz.setText(m.getRateInt() + " Hz");
                      r.desc.setText(m.getRateDesc());
                      r.card.setCardBackgroundColor(colorFor(m.getRateInt()));
                      
                      // 匹配是否为激活中状态面板
                      boolean act = current != null && current.getRateInt() == m.getRateInt();
                      r.card.setCardElevation(act ? 14f : 5f);
                      r.active.setVisibility(act ? View.VISIBLE : View.GONE);
                      r.card.setOnClickListener(v -> { if (listener != null) listener.onClick(m); });
                  }
              }

              private int colorFor(int hz) {
                  if (hz >= 144) return Color.parseColor("#1E88E5");
                  if (hz >= 120) return Color.parseColor("#2196F3");
                  if (hz >= 90)  return Color.parseColor("#00ACC1");
                  if (hz >= 60)  return Color.parseColor("#00897B");
                  return Color.parseColor("#FFA726");
              }

              static class HVH extends RecyclerView.ViewHolder {
                  TextView title;
                  HVH(View v) { super(v); title = v.findViewById(R.id.tv_header_title); }
              }
              static class RVH extends RecyclerView.ViewHolder {
                  CardView card;
                  TextView name, hz, desc, active;
                  RVH(View v) {
                      super(v);
                      card   = v.findViewById(R.id.card_rate);
                      name   = v.findViewById(R.id.tv_rate_name);
                      hz     = v.findViewById(R.id.tv_rate_hz);
                      desc   = v.findViewById(R.id.tv_rate_desc);
                      active = v.findViewById(R.id.tv_rate_active);
                  }
              }
          }
          EOF

          # ── HomeFragment.java（高分辨率置顶优先展示 + 权限拦截高颜值动画弹窗） ──
          cat > app/src/main/java/com/pmahz/fragment/HomeFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.view.*;
          import androidx.appcompat.app.AlertDialog;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.*;
          import android.widget.Toast;
          import com.pmahz.R;
          import com.pmahz.adapter.RateAdapter;
          import com.pmahz.model.DisplayMode;
          import com.pmahz.util.RootUtils;
          import java.util.*;

          public class HomeFragment extends Fragment {
              private RateAdapter adapter;
              private boolean hasRootPermission = false;

              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_home, c, false);
                  RecyclerView rv = v.findViewById(R.id.recycler_rates);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  
                  checkRootStatus();

                  List<Object> items = buildList();
                  adapter = new RateAdapter(getContext(), items, this::apply);
                  rv.setAdapter(adapter);
                  return v;
              }

              private void checkRootStatus() {
                  new Thread(() -> { hasRootPermission = RootUtils.isRooted(); }).start();
              }

              private List<Object> buildList() {
                  DisplayManager dm = (DisplayManager) requireActivity().getSystemService(Context.DISPLAY_SERVICE);
                  android.view.Display d = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY);
                  android.view.Display.Mode[] modes = d.getSupportedModes();
                  Map<String, List<DisplayMode>> grouped = new LinkedHashMap<>();
                  
                  for (android.view.Display.Mode m : modes) {
                      String k = m.getPhysicalWidth() + "x" + m.getPhysicalHeight();
                      grouped.computeIfAbsent(k, x -> new ArrayList<>())
                             .add(new DisplayMode(m.getPhysicalWidth(), m.getPhysicalHeight(), m.getRefreshRate(), m.getModeId()));
                  }
                  
                  List<String> keys = new ArrayList<>(grouped.keySet());
                  // 强制重构排序：总像素高的【高分辨率组】优先排在前面
                  keys.sort((a, b) -> {
                      String[] pa = a.split("x"), pb = b.split("x");
                      int resA = Integer.parseInt(pa[0]) * Integer.parseInt(pa[1]);
                      int resB = Integer.parseInt(pb[0]) * Integer.parseInt(pb[1]);
                      return Integer.compare(resB, resA);
                  });
                  
                  if (keys.isEmpty()) return fallback();
                  List<Object> items = new ArrayList<>();
                  for (int i = 0; i < keys.size(); i++) {
                      List<DisplayMode> ms = grouped.get(keys.get(i));
                      ms.sort((a, b) -> Float.compare(b.getRefreshRate(), a.getRefreshRate()));
                      String label = keys.size() == 1
                          ? "📱 " + ms.get(0).getResolutionLabel() + " | 检测到多档硬件帧率"
                          : i == 0 ? "✨ 高分辨率优先  " + ms.get(0).getResolutionLabel()
                                   : "🔋 低分辨率降阶  " + ms.get(0).getResolutionLabel();
                      items.add(label);
                      items.addAll(ms);
                  }
                  return items;
              }

              private List<Object> fallback() {
                  int[] rs = {60, 90, 120, 144, 175};
                  List<Object> l = new ArrayList<>();
                  l.add("📱 1080×2400 | 已自动探测全域档位");
                  for (int r : rs) l.add(new DisplayMode(1080, 2400, r, -1));
                  return l;
              }

              private void apply(DisplayMode m) {
                  if (!hasRootPermission) {
                      showNoRootDialog();
                      return;
                  }
                  new Thread(() -> {
                      boolean ok = RootUtils.setRefreshRate(m.getWidth(), m.getHeight(), m.getRateInt());
                      requireActivity().runOnUiThread(() -> {
                          if (ok) {
                              adapter.setCurrent(m);
                              Toast.makeText(getContext(), "✅ 已成功应用 " + m.getRateInt() + " Hz", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(getContext(), "❌ 指令下发未成功，请检查根权限", Toast.LENGTH_LONG).show();
                          }
                      });
                  }).start();
              }

              private void showNoRootDialog() {
                  if (getContext() == null) return;
                  AlertDialog dialog = new AlertDialog.Builder(getContext(), android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle("🔒 权限未获授权")
                      .setMessage("没有获取root权限，请赋予root权限之后再选择切换。")
                      .setPositiveButton("我知道了", (d, w) -> { d.dismiss(); checkRootStatus(); })
                      .create();
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().getAttributes().windowAnimations = android.R.style.Animation_Dialog;
                  }
                  dialog.show();
              }
          }
          EOF

