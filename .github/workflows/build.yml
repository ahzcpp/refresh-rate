          package com.pmahz.util;
          import android.content.pm.PackageManager;
          import android.util.Log;
          import java.io.*;
          import rikka.shizuku.Shizuku;
          public class ShizukuUtils {
              private static final String TAG = "ShizukuUtils";
              public static final int REQUEST_CODE = 1001;
              public static boolean isAvailable() {
                  try { return Shizuku.pingBinder(); } catch (Exception e) { return false; }
              }
              public static boolean hasPermission() {
                  try {
                      if (Shizuku.isPreV11()) return false;
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Exception e) { return false; }
              }
              public static void requestPermission() {
                  try { Shizuku.requestPermission(REQUEST_CODE); }
                  catch (Exception e) { Log.e(TAG, e.getMessage()); }
              }
              public static boolean setRefreshRate(int modeId, int hz) {
                  if (!isAvailable() || !hasPermission()) return false;
                  int idx = modeId - 1;
                  String script = "service call SurfaceFlinger 1035 i32 " + idx +
                      " && settings put system peak_refresh_rate " + hz + ".0" +
                      " && settings put system min_refresh_rate " + hz + ".0" +
                      " && settings put system user_refresh_rate " + hz;
                  return execShizuku(script);
              }
              private static boolean execShizuku(String cmd) {
                  try {
                      Process p = execShizukuProcess(cmd);
                      p.waitFor();
                      return true;
                  } catch (Exception e) { Log.e(TAG, e.getMessage()); return false; }
              }
              private static Process execShizukuProcess(String cmd) throws Exception {
                  java.lang.reflect.Method method = Shizuku.class.getDeclaredMethod(
                      "newProcess", String[].class, String[].class, String.class);
                  method.setAccessible(true);
                  return (Process) method.invoke(null, new String[]{"sh","-c",cmd}, null, null);
              }
          }
