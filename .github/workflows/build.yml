          package com.pmahz.util;
          import android.util.Log;
          import com.pmahz.model.DisplayMode;
          import java.io.*;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class RootUtils {
              private static final String TAG = "RootUtils";
              public static boolean isRooted() {
                  Process p=null; DataOutputStream os=null; BufferedReader r=null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("echo RootOK\nexit\n"); os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      return "RootOK".equals(r.readLine());
                  } catch (Exception e) { return false; }
                  finally {
                      try{if(os!=null)os.close();}catch(Exception ignored){}
                      try{if(r!=null)r.close();}catch(Exception ignored){}
                      try{if(p!=null)p.destroy();}catch(Exception ignored){}
                  }
              }
              public static List<DisplayMode> getDisplayModesFromDumpsys() {
                  List<DisplayMode> list = new ArrayList<>();
                  Process p=null; DataOutputStream os=null; BufferedReader r=null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("dumpsys display | grep 'DisplayModeRecord'\nexit\n"); os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line;
                      Pattern pat = Pattern.compile("id=(\\d+),\\s*width=(\\d+),\\s*height=(\\d+),\\s*fps=([\\d.]+)");
                      while ((line=r.readLine())!=null) {
                          Matcher m = pat.matcher(line);
                          if (m.find()) list.add(new DisplayMode(
                              Integer.parseInt(m.group(2)), Integer.parseInt(m.group(3)),
                              Float.parseFloat(m.group(4)), Integer.parseInt(m.group(1))));
                      }
                  } catch (Exception e) { Log.e(TAG, "dumpsys", e); }
                  finally {
                      try{if(os!=null)os.close();}catch(Exception ignored){}
                      try{if(r!=null)r.close();}catch(Exception ignored){}
                      try{if(p!=null)p.destroy();}catch(Exception ignored){}
                  }
                  return list;
              }
              public static boolean setRefreshRate(int modeId, int hz) {
                  Process pr=null; DataOutputStream os=null;
                  try {
                      int idx = modeId - 1;
                      pr = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(pr.getOutputStream());
                      os.writeBytes("service call SurfaceFlinger 1035 i32 " + idx + "\n");
                      os.writeBytes("settings put system peak_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put system min_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put system user_refresh_rate " + hz + "\n");
                      os.writeBytes("settings put secure miui_refresh_rate " + hz + "\n");
                      os.writeBytes("exit\n"); os.flush();
                      pr.waitFor();
                      return true;
                  } catch (Exception e) { return false; }
                  finally {
                      try{if(os!=null)os.close();}catch(Exception ignored){}
                      try{if(pr!=null)pr.destroy();}catch(Exception ignored){}
                  }
              }
              public static String generateRuntimeLog() {
                  StringBuilder sb = new StringBuilder("=== 屏幕刷新率工具 日志 ===\n");
                  sb.append("Root: ").append(isRooted() ? "已授权" : "未授权").append("\n\n");
                  Process p=null; DataOutputStream os=null; BufferedReader r=null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("dumpsys display | grep 'DisplayModeRecord'\nexit\n"); os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line;
                      while ((line=r.readLine())!=null) sb.append(line.trim()).append("\n");
                  } catch (Exception e) { sb.append("Err: ").append(e.getMessage()); }
                  finally {
                      try{if(os!=null)os.close();}catch(Exception ignored){}
                      try{if(r!=null)r.close();}catch(Exception ignored){}
                      try{if(p!=null)p.destroy();}catch(Exception ignored){}
                  }
                  return sb.toString();
              }
          }
