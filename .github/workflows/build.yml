          # AdbUtils.java（常驻模式，脚本执行后立即返回）
          cat > app/src/main/java/com/pmahz/util/AdbUtils.java << 'EOF'
          package com.pmahz.util;
          import android.content.Context;
          import android.util.Log;
          import com.pmahz.model.DisplayMode;
          import java.io.*;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class AdbUtils {
              private static final String TAG = "AdbUtils";
              private static final String CMD_DIR = "/data/local/tmp/refresh-rate-tool";
              private static final File CMD_FILE = new File(CMD_DIR, "cmd");
              private static final File RES_FILE = new File(CMD_DIR, "result");
              private static final File HB_FILE  = new File(CMD_DIR, "heartbeat");
              private static final long TIMEOUT_MS = 3000;

              public static File getScriptFile(Context ctx) {
                  File dir = ctx.getExternalFilesDir(null);
                  if (dir == null) dir = ctx.getFilesDir();
                  return new File(dir, "iniadb.sh");
              }

              public static void generateScript(Context ctx) {
                  File script = getScriptFile(ctx);
                  File parent = script.getParentFile();
                  if (parent != null && !parent.exists()) parent.mkdirs();
                  try (FileWriter fw = new FileWriter(script)) {
                      fw.write("#!/system/bin/sh\n");
                      fw.write("DIR=" + CMD_DIR + "\n");
                      fw.write("mkdir -p $DIR\n");
                      fw.write("chmod 777 $DIR\n");
                      // 后台循环，并立即退出当前脚本
                      fw.write("nohup sh -c 'while true; do date +%s > $DIR/heartbeat; if [ -s \"$DIR/cmd\" ]; then CMD=$(cat \"$DIR/cmd\"); truncate -s 0 \"$DIR/cmd\"; eval \"$CMD\" > \"$DIR/result\" 2>&1; echo \"---DONE---\" >> \"$DIR/result\"; fi; sleep 0.5; done' > /dev/null 2>&1 &\n");
                      fw.write("echo 'OK'\n");
                  } catch (IOException e) {
                      Log.e(TAG, "generateScript", e);
                  }
                  script.setExecutable(true, false);
              }

              public static String getAdbCommand(Context ctx) {
                  return "adb shell sh " + getScriptFile(ctx).getAbsolutePath();
              }

              public static boolean isRunning() {
                  if (!HB_FILE.exists()) return false;
                  return System.currentTimeMillis() - HB_FILE.lastModified() < 3000;
              }

              public static String exec(String cmd) {
                  if (!isRunning()) return null;
                  try {
                      try (FileWriter fw = new FileWriter(RES_FILE)) { fw.write(""); }
                      try (FileWriter fw = new FileWriter(CMD_FILE)) { fw.write(cmd); }
                      long start = System.currentTimeMillis();
                      while (System.currentTimeMillis() - start < TIMEOUT_MS) {
                          Thread.sleep(100);
                          if (RES_FILE.length() > 0) {
                              StringBuilder sb = new StringBuilder();
                              try (BufferedReader br = new BufferedReader(new FileReader(RES_FILE))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      if ("---DONE---".equals(line)) return sb.toString().trim();
                                      sb.append(line).append("\n");
                                  }
                              }
                          }
                      }
                      return null;
                  } catch (Exception e) { Log.e(TAG, "exec", e); return null; }
              }

              public static boolean setRefreshRate(int modeId, int hz) {
                  int idx = modeId - 1;
                  String cmd = "service call SurfaceFlinger 1035 i32 " + idx +
                      " && settings put system peak_refresh_rate " + hz + ".0" +
                      " && settings put system min_refresh_rate " + hz + ".0" +
                      " && settings put system user_refresh_rate " + hz;
                  return exec(cmd) != null;
              }

              public static List<DisplayMode> getDisplayModes() {
                  List<DisplayMode> list = new ArrayList<>();
                  String out = exec("dumpsys display | grep DisplayModeRecord");
                  if (out == null) return list;
                  Pattern pat = Pattern.compile("id=(\\d+),\\s*width=(\\d+),\\s*height=(\\d+),\\s*fps=([\\d.]+)");
                  for (String line : out.split("\n")) {
                      Matcher m = pat.matcher(line);
                      if (m.find()) list.add(new DisplayMode(
                          Integer.parseInt(m.group(2)), Integer.parseInt(m.group(3)),
                          Float.parseFloat(m.group(4)), Integer.parseInt(m.group(1))));
                  }
                  return list;
              }
          }
