          package com.pmahz;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.app.AppCompatDelegate;
          import androidx.fragment.app.Fragment;
          import androidx.fragment.app.FragmentTransaction;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.pmahz.fragment.HomeFragment;
          import com.pmahz.fragment.SettingsFragment;
          import com.pmahz.util.LanguageUtils;
          import com.pmahz.util.AdbUtils;
          import java.io.InputStream;
          public class MainActivity extends AppCompatActivity implements SharedPreferences.OnSharedPreferenceChangeListener {
              private ImageView wallpaperView;
              private BottomNavigationView bottomNav;
              private SharedPreferences prefs;
              @Override protected void onCreate(Bundle s) {
                  AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO);
                  super.onCreate(s);
                  LanguageUtils.applyLanguage(this);
                  AdbUtils.generateScript(this);
                  setContentView(R.layout.activity_main);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  getWindow().setStatusBarColor(android.graphics.Color.TRANSPARENT);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M)
                      getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  wallpaperView = findViewById(R.id.global_wallpaper);
                  bottomNav = findViewById(R.id.bottom_navigation);
                  prefs = getSharedPreferences("s", MODE_PRIVATE);
                  prefs.registerOnSharedPreferenceChangeListener(this);
                  applyWallpaperAndUI();
                  if (s == null) loadFragment(new HomeFragment(), false);
                  bottomNav.setOnItemSelectedListener(item -> {
                      if (item.getItemId() == R.id.nav_home) { loadFragment(new HomeFragment(), false); return true; }
                      if (item.getItemId() == R.id.nav_settings) { loadFragment(new SettingsFragment(), true); return true; }
                      return false;
                  });
              }
              private void loadFragment(Fragment f, boolean toSet) {
                  FragmentTransaction ft = getSupportFragmentManager().beginTransaction();
                  if (toSet) ft.setCustomAnimations(R.anim.slide_in_right, R.anim.slide_out_left);
                  else ft.setCustomAnimations(R.anim.slide_in_left, R.anim.slide_out_right);
                  ft.replace(R.id.fragment_container, f).commit();
              }
              private void applyWallpaperAndUI() {
                  int type = prefs.getInt("wallpaper_type", 4);
                  float wa = prefs.getFloat("wallpaper_alpha", 0.3f);
                  wallpaperView.setAlpha(wa);
                  bottomNav.getBackground().setAlpha((int)((1f-wa)*255));
                  bottomNav.setElevation(0);
                  if (type == 3) {
                      String uri = prefs.getString("wallpaper_uri", null);
                      if (uri != null) {
                          try {
                              InputStream is = getContentResolver().openInputStream(Uri.parse(uri));
                              wallpaperView.setImageBitmap(BitmapFactory.decodeStream(is));
                          } catch (Exception e) { wallpaperView.setImageResource(R.drawable.wallpaper_white); }
                      } else wallpaperView.setImageResource(R.drawable.wallpaper_white);
                  } else {
                      int id;
                      if (type==1) id=R.drawable.wallpaper_gradient_2;
                      else if (type==2) id=R.drawable.wallpaper_gradient_3;
                      else if (type==5) id=R.drawable.wallpaper_black;
                      else id=R.drawable.wallpaper_white;
                      wallpaperView.setImageResource(id);
                  }
              }
              @Override public void onSharedPreferenceChanged(SharedPreferences sp, String key) {
                  if (key.startsWith("wallpaper_")) applyWallpaperAndUI();
              }
              @Override protected void onDestroy() {
                  super.onDestroy();
                  prefs.unregisterOnSharedPreferenceChangeListener(this);
              }
          }
