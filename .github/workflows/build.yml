          import com.pmahz.model.DisplayMode;
          import com.pmahz.util.LanguageUtils;
          import com.pmahz.util.RootUtils;
          import com.pmahz.util.AdbUtils;
          import java.util.*;
          public class HomeFragment extends Fragment implements SharedPreferences.OnSharedPreferenceChangeListener {
              private RateAdapter adapter;
              private boolean hasRoot = false;
              private List<Object> dataItems = new ArrayList<>();
              private RecyclerView recyclerView;
              private SharedPreferences prefs;
              private View titleBar;
              private TextView titleText;
              private ImageView btnLanguage;
              private PopupWindow languagePopup;
              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_home, c, false);
                  recyclerView = v.findViewById(R.id.recycler_rates);
                  titleBar = v.findViewById(R.id.home_title_bar);
                  titleText = v.findViewById(R.id.home_title_text);
                  btnLanguage = v.findViewById(R.id.btn_language_switch);
                  titleText.setText(R.string.home_title);
                  btnLanguage.setOnClickListener(view -> showLanguagePopup());
                  recyclerView.setLayoutManager(new LinearLayoutManager(getContext()));
                  recyclerView.setItemAnimator(null);
                  adapter = new RateAdapter(getContext(), dataItems, this::onRateSelected);
                  recyclerView.setAdapter(adapter);
                  prefs = requireActivity().getSharedPreferences("s", Context.MODE_PRIVATE);
                  prefs.registerOnSharedPreferenceChangeListener(this);
                  updateUI();
                  loadData();
                  return v;
              }
              private void showLanguagePopup() {
                  if (languagePopup != null && languagePopup.isShowing()) languagePopup.dismiss();
                  String[] languages = { getString(R.string.language_zh), getString(R.string.language_zh_tw), getString(R.string.language_en), getString(R.string.language_ja), getString(R.string.language_ug) };
                  String[] codes = {LanguageUtils.LANG_ZH, LanguageUtils.LANG_ZH_TW, LanguageUtils.LANG_EN, LanguageUtils.LANG_JA, LanguageUtils.LANG_UG};
                  String cur = LanguageUtils.getCurrentLang(getContext());
                  ListView lv = new ListView(getContext());
                  ArrayAdapter<String> a = new ArrayAdapter<>(getContext(), android.R.layout.simple_list_item_single_choice, languages);
                  lv.setAdapter(a);
                  lv.setChoiceMode(ListView.CHOICE_MODE_SINGLE);
                  for (int i=0; i<codes.length; i++) if (codes[i].equals(cur)) { lv.setItemChecked(i, true); break; }
                  lv.setOnItemClickListener((p, view, pos, id) -> {
                      String sel = codes[pos];
                      if (!sel.equals(LanguageUtils.getCurrentLang(getContext())))
                          LanguageUtils.setLanguageAndRecreate(requireActivity(), sel);
                      languagePopup.dismiss();
                  });
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.RECTANGLE);
                  bg.setCornerRadius(dpToPx(16));
                  bg.setColor(Color.WHITE);
                  lv.setBackground(bg);
                  lv.setClipToOutline(true);
                  int w = (int)(150 * getResources().getDisplayMetrics().density);
                  languagePopup = new PopupWindow(lv, w, LinearLayout.LayoutParams.WRAP_CONTENT, true);
                  languagePopup.setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(Color.TRANSPARENT));
                  languagePopup.setElevation(12);
                  languagePopup.showAsDropDown(btnLanguage, 0, 8);
              }
              private int dpToPx(int dp) { return (int)(dp * getResources().getDisplayMetrics().density); }
              private void updateUI() {
                  float wa = prefs.getFloat("wallpaper_alpha", 0.3f);
                  float ta = 1f - wa;
                  titleBar.setAlpha(ta); titleText.setAlpha(ta); btnLanguage.setAlpha(1f);
                  recyclerView.setAlpha(1f - prefs.getInt("card_alpha", 0)/100f);
              }
              @Override public void onSharedPreferenceChanged(SharedPreferences sp, String key) {
                  if ("wallpaper_alpha".equals(key) || "card_alpha".equals(key)) updateUI();
              }
              @Override public void onDestroyView() {
                  super.onDestroyView();
                  prefs.unregisterOnSharedPreferenceChangeListener(this);
                  if (languagePopup != null) { languagePopup.dismiss(); languagePopup = null; }
              }
              private void loadData() {
                  new Thread(() -> {
                      hasRoot = RootUtils.isRooted();
                      List<DisplayMode> modes = new ArrayList<>();
                      if (hasRoot) {
                          modes = RootUtils.getDisplayModesFromDumpsys();
                          if (modes.isEmpty()) hasRoot = false;
                      }
                      if (modes.isEmpty() && AdbUtils.isRunning()) {
                          modes = AdbUtils.getDisplayModes();
                      }
                      if (modes.isEmpty()) modes = getFallbackFromDisplayManager();
                      List<Object> built = buildSortedList(modes);
                      if (getActivity() != null) {
                          List<Object> finalBuilt = built;
                          getActivity().runOnUiThread(() -> {
                              dataItems.clear(); dataItems.addAll(finalBuilt); adapter.notifyDataSetChanged();
                          });
                      }
                  }).start();
              }
              private List<DisplayMode> getFallbackFromDisplayManager() {
                  List<DisplayMode> list = new ArrayList<>();
                  try {
                      android.hardware.display.DisplayManager dm = (android.hardware.display.DisplayManager)
                          requireActivity().getSystemService(Context.DISPLAY_SERVICE);
                      android.view.Display d = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY);
                      for (android.view.Display.Mode m : d.getSupportedModes()) {
                          list.add(new DisplayMode(m.getPhysicalWidth(), m.getPhysicalHeight(), m.getRefreshRate(), m.getModeId()));
                      }
                  } catch (Exception ignored) {}
                  return list;
              }
              private List<Object> buildSortedList(List<DisplayMode> modes) {
                  if (modes == null || modes.isEmpty()) return fallback();
                  Map<String, List<DisplayMode>> grouped = new LinkedHashMap<>();
                  for (DisplayMode m : modes) {
                      String k = m.getWidth() + "x" + m.getHeight();
                      grouped.computeIfAbsent(k, x -> new ArrayList<>()).add(m);
                  }
                  List<String> keys = new ArrayList<>(grouped.keySet());
                  keys.sort((a, b) -> {
                      String[] pa = a.split("x"), pb = b.split("x");
                      return Integer.compare(Integer.parseInt(pb[0])*Integer.parseInt(pb[1]), Integer.parseInt(pa[0])*Integer.parseInt(pa[1]));
                  });
                  List<Object> items = new ArrayList<>();
                  Context ctx = getContext();
                  for (int i = 0; i < keys.size(); i++) {
                      List<DisplayMode> ms = grouped.get(keys.get(i));
                      ms.sort((a, b) -> Float.compare(b.getRefreshRate(), a.getRefreshRate()));
                      String label = (i == 0) ? ctx.getString(R.string.high_resolution) + keys.get(i)
                                              : ctx.getString(R.string.low_resolution) + keys.get(i);
                      items.add(label);
                      items.addAll(ms);
                  }
                  return items;
              }
              private List<Object> fallback() {
                  int[] rates = {60, 90, 120, 144, 165, 170, 175, 177};
                  List<Object> l = new ArrayList<>();
                  l.add(getString(R.string.fallback_high_res));
                  for (int r : rates) l.add(new DisplayMode(1272, 2772, r, -1));
                  l.add(getString(R.string.fallback_low_res));
                  for (int r : rates) l.add(new DisplayMode(1080, 2354, r, -1));
                  return l;
              }
              private void onRateSelected(DisplayMode mode) {
                  String authMode = prefs.getString("auth_mode", "");
                  boolean useRoot    = "root".equals(authMode) && hasRoot;
                  boolean useShizuku = "shizuku".equals(authMode)
                          && com.pmahz.util.ShizukuUtils.isAvailable()
                          && com.pmahz.util.ShizukuUtils.hasPermission();
                  boolean useAdb     = "adb".equals(authMode) && AdbUtils.isRunning();
                  if (!useRoot && !useShizuku && !useAdb) {
                      Toast.makeText(getContext(), R.string.no_root_toast, Toast.LENGTH_SHORT).show();
                      return;
                  }
                  new Thread(() -> {
                      boolean ok = false;
                      if (useRoot)         ok = RootUtils.setRefreshRate(mode.getModeId(), mode.getRateInt());
                      else if (useShizuku) ok = com.pmahz.util.ShizukuUtils.setRefreshRate(mode.getModeId(), mode.getRateInt());
                      else if (useAdb)     ok = AdbUtils.setRefreshRate(mode.getModeId(), mode.getRateInt());
                      final boolean success = ok;
                      if (getActivity() != null) {
                          getActivity().runOnUiThread(() -> {
                              if (success) {
                                  adapter.setCurrent(mode);
                                  Toast.makeText(getContext(), getString(R.string.switch_success, mode.getRateInt()), Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(getContext(), R.string.switch_fail, Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                  }).start();
              }
          }
