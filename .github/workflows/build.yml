name: 生成并编译 APK v7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成完整项目源码
        run: |
          mkdir -p app/src/main/java/com/pmahz/fragment
          mkdir -p app/src/main/java/com/pmahz/adapter
          mkdir -p app/src/main/java/com/pmahz/model
          mkdir -p app/src/main/java/com/pmahz/util
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ── settings.gradle ───────────────────────────────
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "屏幕刷新率"
          include ':app'
          EOF

          # ── build.gradle root ─────────────────────────────
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # ── app/build.gradle ──────────────────────────────
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.pmahz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pmahz"
                  minSdk 23
                  targetSdk 34
                  versionCode 7
                  versionName "1.6"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # ── gradle wrapper ────────────────────────────────
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradlew << 'EOF'
          #!/bin/sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ── AndroidManifest.xml ───────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.RefreshRate">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ── 动画定义 ──────────────────────────────────────
          cat > app/src/main/res/anim/item_animation.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:duration="450">
              <translate android:fromYDelta="20%" android:toYDelta="0" android:interpolator="@android:anim/decelerate_interpolator"/>
              <alpha android:fromAlpha="0.0" android:toAlpha="1.0" android:interpolator="@android:anim/decelerate_interpolator"/>
          </set>
          EOF

          # ── 图标规范文件 ──────────────────────────────────
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1A1A1A"/></shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M16,26 Q16,20 22,20 L86,20 Q92,20 92,26 L92,82 Q92,88 86,88 L22,88 Q16,88 16,82 Z"/><path android:fillColor="#1A1A1A" android:pathData="M20,34 L88,34 L88,84 L20,84 Z"/><path android:fillColor="#FF5F57" android:pathData="M26,27 Q26,24 29,24 Q32,24 32,27 Q32,30 29,30 Q26,30 26,27 Z"/><path android:fillColor="#FEBC2E" android:pathData="M37,27 Q37,24 40,24 Q43,24 43,27 Q43,30 40,30 Q37,30 37,27 Z"/><path android:fillColor="#28C840" android:pathData="M48,27 Q48,24 51,24 Q54,24 54,27 Q54,30 51,30 Q48,30 48,27 Z"/><path android:fillColor="#FFFFFF" android:strokeColor="#FFFFFF" android:strokeWidth="2" android:pathData="M28,52 L38,59 L28,66"/><path android:fillColor="#FFFFFF" android:pathData="M43,66 L72,66 L72,70 L43,70 Z"/></vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          # ── DisplayMode.java ──────────────────────────────
          cat > app/src/main/java/com/pmahz/model/DisplayMode.java << 'EOF'
          package com.pmahz.model;
          public class DisplayMode {
              private int width, height, modeId;
              private float refreshRate;
              public DisplayMode(int w, int h, float r, int id) {
                  width=w; height=h; refreshRate=r; modeId=id;
              }
              public int getWidth(){return width;}
              public int getHeight(){return height;}
              public float getRefreshRate(){return refreshRate;}
              public int getModeId(){return modeId;}
              public String getResolutionLabel(){return width+"x"+height;}
              public int getRateInt(){return Math.round(refreshRate);}
              public String getRateName(){
                  int r=getRateInt();
                  if(r>=144)return "高刷";
                  if(r>=120)return "极致";
                  if(r>=90)return "极佳";
                  if(r>=60)return "流畅";
                  return "标准";
              }
              public String getRateDesc(){
                  int r=getRateInt();
                  if(r>=144)return "臻享视界，完美观感";
                  if(r>=120)return "画面流畅动人，舒适体验";
                  if(r>=90)return "提高刷新率，极致体验";
                  if(r>=60)return "较高刷新率，画面流畅";
                  return "常规刷新率，延长续航";
              }
          }
          EOF

          # ── RootUtils.java（彻底移除Dumpsys解析，直接投喂SurfaceFlinger 1035） ──
          cat > app/src/main/java/com/pmahz/util/RootUtils.java << 'EOF'
          package com.pmahz.util;
          import android.util.Log;
          import java.io.*;

          public class RootUtils {
              private static final String TAG = "RootUtils";

              public static boolean isRooted() {
                  Process p = null;
                  DataOutputStream os = null;
                  BufferedReader r = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("echo RootOK\nexit\n");
                      os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line = r.readLine();
                      return "RootOK".equals(line);
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(r != null) r.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }

              /**
               * 依据完全正确的模式 ID，直接向 Binder 通道下发高频锁定指令
               */
              public static boolean setRefreshRate(int modeId, int targetHz) {
                  Process process = null;
                  DataOutputStream os = null;
                  
                  // 针对未成功探测到硬件模式的极端降级兜底匹配
                  int finalModeId = modeId;
                  if (finalModeId == -1) {
                      if (targetHz == 60) finalModeId = 2;
                      else if (targetHz == 90) finalModeId = 3;
                      else if (targetHz == 120) finalModeId = 1;
                      else if (targetHz == 144) finalModeId = 4;
                      else if (targetHz == 165) finalModeId = 5;
                      else if (targetHz == 175) finalModeId = 7;
                      else if (targetHz == 177) finalModeId = 8;
                      else finalModeId = 1;
                  }

                  try {
                      process = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(process.getOutputStream());

                      // 核心命令：直接注入你测试完全成功的精确硬件模式 ID 
                      os.writeBytes("service call SurfaceFlinger 1035 i32 " + finalModeId + "\n");

                      // 全局辅助锁定：重写大厂系统底层框架变量，稳死高刷不回弹
                      os.writeBytes("settings put system peak_refresh_rate " + targetHz + ".0\n");
                      os.writeBytes("settings put system min_refresh_rate " + targetHz + ".0\n");
                      os.writeBytes("settings put system peak_refresh_rate " + targetHz + "\n");
                      os.writeBytes("settings put system min_refresh_rate " + targetHz + "\n");
                      os.writeBytes("settings put system user_refresh_rate " + targetHz + "\n");
                      os.writeBytes("settings put secure miui_refresh_rate " + targetHz + "\n");
                      os.writeBytes("settings put secure refresh_rate_mode 2\n");
                      
                      os.writeBytes("exit\n");
                      os.flush();
                      process.waitFor();
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "Binder 指令注入失败: " + e.getMessage());
                      return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(process != null) process.destroy(); } catch(Exception ignored){}
                  }
              }
          }
          EOF

          # ── RateAdapter.java ──────────────────────────────
          cat > app/src/main/java/com/pmahz/adapter/RateAdapter.java << 'EOF'
          package com.pmahz.adapter;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.*;
          import android.view.animation.AnimationUtils;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;
          import androidx.recyclerview.widget.RecyclerView;
          import com.pmahz.R;
          import com.pmahz.model.DisplayMode;
          import java.util.List;

          public class RateAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              public static final int TYPE_HEADER = 0, TYPE_RATE = 1;
              public interface OnRateClick { void onClick(DisplayMode m); }
              private List<Object> items;
              private Context ctx;
              private OnRateClick listener;
              private DisplayMode current;

              public RateAdapter(Context c, List<Object> i, OnRateClick l) { ctx=c; items=i; listener=l; }
              public void update(List<Object> i) { items=i; notifyDataSetChanged(); }
              public void setCurrent(DisplayMode m) { current=m; notifyDataSetChanged(); }
              @Override public int getItemViewType(int p) { return items.get(p) instanceof String ? TYPE_HEADER : TYPE_RATE; }
              @Override public int getItemCount() { return items==null ? 0 : items.size(); }

              @Override public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                  LayoutInflater inf = LayoutInflater.from(ctx);
                  if (t == TYPE_HEADER) return new HVH(inf.inflate(R.layout.item_res_header, p, false));
                  return new RVH(inf.inflate(R.layout.item_rate_card, p, false));
              }

              @Override public void onBindViewHolder(RecyclerView.ViewHolder h, int pos) {
                  h.itemView.startAnimation(AnimationUtils.loadAnimation(ctx, R.anim.item_animation));
                  if (getItemViewType(pos) == TYPE_HEADER) {
                      ((HVH) h).title.setText((String) items.get(pos));
                  } else {
                      DisplayMode m = (DisplayMode) items.get(pos);
                      RVH r = (RVH) h;
                      r.name.setText(m.getRateName());
                      r.hz.setText(m.getRateInt() + " Hz");
                      r.desc.setText(m.getRateDesc());
                      r.card.setCardBackgroundColor(colorFor(m.getRateInt()));
                      
                      boolean act = current != null && current.getRateInt() == m.getRateInt();
                      r.card.setCardElevation(act ? 14f : 5f);
                      r.active.setVisibility(act ? View.VISIBLE : View.GONE);
                      r.card.setOnClickListener(v -> { if (listener != null) listener.onClick(m); });
                  }
              }

              private int colorFor(int hz) {
                  if (hz >= 144) return Color.parseColor("#1E88E5");
                  if (hz >= 120) return Color.parseColor("#2196F3");
                  if (hz >= 90)  return Color.parseColor("#00ACC1");
                  if (hz >= 60)  return Color.parseColor("#00897B");
                  return Color.parseColor("#FFA726");
              }

              static class HVH extends RecyclerView.ViewHolder {
                  TextView title;
                  HVH(View v) { super(v); title = v.findViewById(R.id.tv_header_title); }
              }
              static class RVH extends RecyclerView.ViewHolder {
                  CardView card;
                  TextView name, hz, desc, active;
                  RVH(View v) {
                      super(v);
                      card   = v.findViewById(R.id.card_rate);
                      name   = v.findViewById(R.id.tv_rate_name);
                      hz     = v.findViewById(R.id.tv_rate_hz);
                      desc   = v.findViewById(R.id.tv_rate_desc);
                      active = v.findViewById(R.id.tv_rate_active);
                  }
              }
          }
          EOF

          # ── HomeFragment.java（原生获取系统硬件 Mode ID 传递给命令） ─────────────────
          cat > app/src/main/java/com/pmahz/fragment/HomeFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.view.*;
          import androidx.appcompat.app.AlertDialog;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.*;
          import android.widget.Toast;
          import com.pmahz.R;
          import com.pmahz.adapter.RateAdapter;
          import com.pmahz.model.DisplayMode;
          import com.pmahz.util.RootUtils;
          import java.util.*;

          public class HomeFragment extends Fragment {
              private RateAdapter adapter;
              private boolean hasRootPermission = false;

              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_home, c, false);
                  RecyclerView rv = v.findViewById(R.id.recycler_rates);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  
                  checkRootStatus();

                  List<Object> items = buildList();
                  adapter = new RateAdapter(getContext(), items, this::apply);
                  rv.setAdapter(adapter);
                  return v;
              }

              private void checkRootStatus() {
                  new Thread(() -> { hasRootPermission = RootUtils.isRooted(); }).start();
              }

              private List<Object> buildList() {
                  DisplayManager dm = (DisplayManager) requireActivity().getSystemService(Context.DISPLAY_SERVICE);
                  android.view.Display d = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY);
                  android.view.Display.Mode[] modes = d.getSupportedModes();
                  Map<String, List<DisplayMode>> grouped = new LinkedHashMap<>();
                  
                  for (android.view.Display.Mode m : modes) {
                      String k = m.getPhysicalWidth() + "x" + m.getPhysicalHeight();
                      grouped.computeIfAbsent(k, x -> new ArrayList<>())
                             .add(new DisplayMode(m.getPhysicalWidth(), m.getPhysicalHeight(), m.getRefreshRate(), m.getModeId()));
                  }
                  
                  List<String> keys = new ArrayList<>(grouped.keySet());
                  keys.sort((a, b) -> {
                      String[] pa = a.split("x"), pb = b.split("x");
                      int resA = Integer.parseInt(pa[0]) * Integer.parseInt(pa[1]);
                      int resB = Integer.parseInt(pb[0]) * Integer.parseInt(pb[1]);
                      return Integer.compare(resB, resA);
                  });
                  
                  if (keys.isEmpty()) return fallback();
                  List<Object> items = new ArrayList<>();
                  for (int i = 0; i < keys.size(); i++) {
                      List<DisplayMode> ms = grouped.get(keys.get(i));
                      ms.sort((a, b) -> Float.compare(b.getRefreshRate(), a.getRefreshRate()));
                      String label = keys.size() == 1
                          ? "📱 " + ms.get(0).getResolutionLabel() + " | 检测到多档硬件帧率"
                          : i == 0 ? "✨ 高分辨率优先  " + ms.get(0).getResolutionLabel()
                                   : "🔋 低分辨率降阶  " + ms.get(0).getResolutionLabel();
                      items.add(label);
                      items.addAll(ms);
                  }
                  return items;
              }

              private List<Object> fallback() {
                  int[] rs = {60, 90, 120, 144, 165, 175, 177};
                  List<Object> l = new ArrayList<>();
                  l.add("📱 1272x2772 | 已自动探测全域档位");
                  for (int r : rs) l.add(new DisplayMode(1272, 2772, r, -1));
                  return l;
              }

              private void apply(DisplayMode m) {
                  if (!hasRootPermission) {
                      showNoRootDialog();
                      return;
                  }
                  new Thread(() -> {
                      // 关键改动：直接把硬件底层配对的 getModeId() 送入底层执行，精准秒切
                      boolean ok = RootUtils.setRefreshRate(m.getModeId(), m.getRateInt());
                      requireActivity().runOnUiThread(() -> {
                          if (ok) {
                              adapter.setCurrent(m);
                              Toast.makeText(getContext(), "✅ 已成功应用 " + m.getRateInt() + " Hz", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(getContext(), "❌ 指令下发未成功，请检查根权限", Toast.LENGTH_LONG).show();
                          }
                      });
                  }).start();
              }

              private void showNoRootDialog() {
                  if (getContext() == null) return;
                  AlertDialog dialog = new AlertDialog.Builder(getContext(), android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle("🔒 权限未获授权")
                      .setMessage("没有获取root权限，请赋予root权限之后再选择切换。")
                      .setPositiveButton("我知道了", (d, w) -> { d.dismiss(); checkRootStatus(); })
                      .create();
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().getAttributes().windowAnimations = android.R.style.Animation_Dialog;
                  }
                  dialog.show();
              }
          }
          EOF

          # ── SettingsFragment.java ──────────────────────────────────────────
          cat > app/src/main/java/com/pmahz/fragment/SettingsFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.fragment.app.Fragment;
          import com.pmahz.R;
          import com.pmahz.util.RootUtils;

          public class SettingsFragment extends Fragment {
              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_settings, c, false);
                  TextView status = v.findViewById(R.id.tv_root_status);
                  Button btnFollow = v.findViewById(R.id.btn_follow_coolapk);

                  status.setText("🔄 探测底层硬件环境...");
                  new Thread(() -> {
                      boolean ok = RootUtils.isRooted();
                      if (isAdded() && getActivity() != null) {
                          getActivity().runOnUiThread(() -> {
                              if (ok) {
                                  status.setText("已获取高级超级用户 Root 权限");
                                  status.setTextColor(Color.parseColor("#2ECC71"));
                              } else {
                                  status.setText("没有获取 Root 权限");
                                  status.setTextColor(Color.parseColor("#E74C3C"));
                              }
                          });
                      }
                  }).start();

                  btnFollow.setOnClickListener(x -> {
                      String targetUrl = "https://www.coolapk.com/u/31452988";
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                      intent.setPackage("com.coolapk.market");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                          startActivity(webIntent);
                      }
                  });
                  return v;
              }
          }
          EOF

          # ── MainActivity.java ─────────────────────────────
          cat > app/src/main/java/com/pmahz/MainActivity.java << 'EOF'
          package com.pmahz;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.fragment.app.Fragment;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.pmahz.fragment.HomeFragment;
          import com.pmahz.fragment.SettingsFragment;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_main);
                  BottomNavigationView nav = findViewById(R.id.bottom_navigation);
                  if (s == null) load(new HomeFragment());
                  nav.setOnItemSelectedListener(item -> {
                      if (item.getItemId() == R.id.nav_home)     { load(new HomeFragment());     return true; }
                      if (item.getItemId() == R.id.nav_settings) { load(new SettingsFragment()); return true; }
                      return false;
                  });
              }
              void load(Fragment f) {
                  getSupportFragmentManager().beginTransaction().replace(R.id.fragment_container, f).commit();
              }
          }
          EOF

