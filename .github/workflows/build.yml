          # ── item_rate_card.xml（单列大卡片，和图1一致） ───
          cat > app/src/main/res/layout/item_rate_card.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:paddingTop="6dp" android:paddingBottom="2dp">
              <androidx.cardview.widget.CardView android:id="@+id/card_rate"
                  android:layout_width="match_parent" android:layout_height="110dp"
                  app:cardCornerRadius="20dp" app:cardElevation="5dp">
                  <RelativeLayout android:layout_width="match_parent"
                      android:layout_height="match_parent" android:padding="18dp">
                      <!-- 左上：档位名称 -->
                      <TextView android:id="@+id/tv_rate_name"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="15sp" android:textColor="#DDEEFF"
                          android:layout_alignParentStart="true" android:layout_alignParentTop="true"/>
                      <!-- 右上：当前标签 -->
                      <TextView android:id="@+id/tv_rate_active"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="✓ 当前" android:textSize="13sp" android:textColor="#FFFFFF"
                          android:background="#44FFFFFF" android:paddingStart="10dp"
                          android:paddingEnd="10dp" android:paddingTop="3dp" android:paddingBottom="3dp"
                          android:layout_alignParentEnd="true" android:layout_alignParentTop="true"
                          android:visibility="gone"/>
                      <!-- 中：大字 Hz -->
                      <TextView android:id="@+id/tv_rate_hz"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="36sp" android:textStyle="bold" android:textColor="#FFFFFF"
                          android:layout_below="@id/tv_rate_name" android:layout_marginTop="2dp"/>
                      <!-- 底部：描述 -->
                      <TextView android:id="@+id/tv_rate_desc"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:textSize="12sp" android:textColor="#CCDDFF"
                          android:layout_alignParentBottom="true" android:maxLines="1"/>
                  </RelativeLayout>
              </androidx.cardview.widget.CardView>
              <!-- 卡片下方小描述（在卡片外面，和图1一样） -->
          </LinearLayout>
          EOF

          # ── item_res_header.xml ───────────────────────────
          cat > app/src/main/res/layout/item_res_header.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="horizontal" android:paddingStart="4dp" android:paddingEnd="10dp"
              android:paddingTop="16dp" android:paddingBottom="4dp" android:gravity="center_vertical">
              <View android:layout_width="4dp" android:layout_height="22dp"
                  android:background="#1976D2" android:layout_marginEnd="10dp"/>
              <TextView android:id="@+id/tv_header_title"
                  android:layout_width="0dp" android:layout_height="wrap_content"
                  android:layout_weight="1" android:textSize="15sp" android:textStyle="bold"
                  android:textColor="#333355"/>
          </LinearLayout>
          EOF

          # ── fragment_settings.xml ─────────────────────────
          cat > app/src/main/res/layout/fragment_settings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#F0F4FF">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:padding="16dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="设置" android:textSize="28sp" android:textStyle="bold"
                      android:textColor="#1A1A2E" android:paddingBottom="16dp"/>
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="12dp"
                      app:cardCornerRadius="16dp" app:cardElevation="4dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="20dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="🔑  权限管理" android:textSize="16sp" android:textStyle="bold"
                              android:textColor="#1976D2" android:paddingBottom="12dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="horizontal" android:gravity="center_vertical">
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                  android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="Root 运行" android:textSize="16sp" android:textColor="#222222"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="适用于已 Root 的设备" android:textSize="13sp" android:textColor="#888888"/>
                              </LinearLayout>
                              <com.google.android.material.switchmaterial.SwitchMaterial
                                  android:id="@+id/switch_root"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                          <TextView android:id="@+id/tv_root_status"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="Root 模式已关闭" android:textSize="13sp"
                              android:textColor="#555555" android:layout_marginTop="12dp"/>
                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btn_test_root"
                              android:layout_width="match_parent" android:layout_height="48dp"
                              android:text="检测 Root 权限" android:layout_marginTop="14dp"
                              app:cornerRadius="12dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" app:cardCornerRadius="16dp" app:cardElevation="4dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="20dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="ℹ️  关于" android:textSize="16sp" android:textStyle="bold"
                              android:textColor="#1976D2" android:paddingBottom="8dp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="屏幕刷新率切换工具\n版本：1.1\n包名：com.pmahz\n\n支持 SurfaceFlinger 底层切换"
                              android:textSize="14sp" android:textColor="#444444" android:lineSpacingExtra="4dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
              </LinearLayout>
          </ScrollView>
          EOF

          # ── menu ──────────────────────────────────────────
          cat > app/src/main/res/menu/bottom_nav_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_home" android:icon="@android:drawable/ic_menu_gallery" android:title="主页"/>
              <item android:id="@+id/nav_settings" android:icon="@android:drawable/ic_menu_preferences" android:title="设置"/>
          </menu>
          EOF

          # ── values ────────────────────────────────────────
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#1976D2</color>
              <color name="primary_dark">#1565C0</color>
              <color name="accent">#42A5F5</color>
              <color name="white">#FFFFFFFF</color>
              <color name="black">#FF000000</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">屏幕刷新率</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RefreshRate" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
              </style>
          </resources>
          EOF

          echo "✅ 所有文件生成完毕"

      - name: 设置 Android SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 编译 APK
        run: gradle assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 屏幕刷新率-v1.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
