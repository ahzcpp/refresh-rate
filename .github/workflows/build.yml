          # ── mipmap 资源 ───────────────────────────────────
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          # ── DisplayMode.java ──────────────────────────────
          cat > app/src/main/java/com/pmahz/model/DisplayMode.java << 'EOF'
          package com.pmahz.model;
          public class DisplayMode {
              private int width, height, modeId;
              private float refreshRate;
              public DisplayMode(int w, int h, float r, int id) {
                  width=w; height=h; refreshRate=r; modeId=id;
              }
              public int getWidth(){return width;}
              public int getHeight(){return height;}
              public float getRefreshRate(){return refreshRate;}
              public int getModeId(){return modeId;}
              public String getResolutionLabel(){return width+"x"+height;}
              public int getRateInt(){return Math.round(refreshRate);}
              public String getRateName(){
                  int r=getRateInt();
                  if(r>=144)return "高刷";
                  if(r>=120)return "极致";
                  if(r>=90)return "极佳";
                  if(r>=60)return "流畅";
                  return "标准";
              }
              public String getRateDesc(){
                  int r=getRateInt();
                  if(r>=170)return "超极限帧率，极致顺滑体验";
                  if(r>=144)return "臻享视界，完美观感";
                  if(r>=120)return "画面流畅动人，舒适体验";
                  if(r>=90)return "提高刷新率，极致体验";
                  if(r>=60)return "较高刷新率，画面流畅";
                  return "常规刷新率，延长续航";
              }
          }
          EOF

          # ── RootUtils.java ────────────────────────────────
          cat > app/src/main/java/com/pmahz/util/RootUtils.java << 'EOF'
          package com.pmahz.util;
          import android.util.Log;
          import java.io.*;

          public class RootUtils {
              private static final String TAG = "RootUtils";
              
              public static boolean isRooted() {
                  Process p = null; DataOutputStream os = null; BufferedReader r = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("echo RootOK\nexit\n"); os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      return "RootOK".equals(r.readLine());
                  } catch (Exception e) { return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(r != null) r.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }
              
              public static boolean setRefreshRate(int modeId, int targetHz) {
                  Process p = null; DataOutputStream os = null;
                  int finalModeId = modeId;
                  
                  if (finalModeId == -1) {
                      if (targetHz == 60) finalModeId = 2;
                      else if (targetHz == 90) finalModeId = 3;
                      else if (targetHz == 120) finalModeId = 1;
                      else if (targetHz == 144) finalModeId = 4;
                      else if (targetHz == 170) finalModeId = 5; 
                      else if (targetHz == 175) finalModeId = 6; 
                      else if (targetHz == 177) finalModeId = 7; 
                      else finalModeId = 1;
                  }
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      
                      os.writeBytes("service call SurfaceFlinger 1035 i32 " + finalModeId + "\n");
                      String rateStr = targetHz + ".0";
                      os.writeBytes("settings put system peak_refresh_rate " + rateStr + "\n");
                      os.writeBytes("settings put system min_refresh_rate " + rateStr + "\n");
                      os.writeBytes("settings put system user_refresh_rate " + targetHz + "\n");
                      os.writeBytes("settings put secure miui_refresh_rate " + targetHz + "\n");
                      
                      os.writeBytes("exit\n"); os.flush(); 
                      int code = p.waitFor();
                      Log.d(TAG, "setRefreshRate targetHz=" + targetHz + " exitCode=" + code);
                      return code == 0;
                  } catch (Exception e) {
                      Log.e(TAG, "setRefreshRate failed: " + e.getMessage());
                      return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }
          }
          EOF

          # ── RateAdapter.java ──────────────────────────────
          cat > app/src/main/java/com/pmahz/adapter/RateAdapter.java << 'EOF'
          package com.pmahz.adapter;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.*;
          import android.view.animation.AnimationUtils;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;
          import androidx.recyclerview.widget.RecyclerView;
          import com.pmahz.R;
          import com.pmahz.model.DisplayMode;
          import java.util.List;

          public class RateAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              public static final int TYPE_HEADER = 0, TYPE_RATE = 1;
              public interface OnRateClick { void onClick(DisplayMode m); }
              private List<Object> items; private Context ctx; private OnRateClick listener; private DisplayMode current;
              public RateAdapter(Context c, List<Object> i, OnRateClick l) { ctx=c; items=i; listener=l; }
              public void update(List<Object> i) { items=i; notifyDataSetChanged(); }
              public void setCurrent(DisplayMode m) { current=m; notifyDataSetChanged(); }
              @Override public int getItemViewType(int p) { return items.get(p) instanceof String ? TYPE_HEADER : TYPE_RATE; }
              @Override public int getItemCount() { return items==null ? 0 : items.size(); }
              @Override public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                  LayoutInflater inf = LayoutInflater.from(ctx);
                  if (t == TYPE_HEADER) return new HVH(inf.inflate(R.layout.item_res_header, p, false));
                  return new RVH(inf.inflate(R.layout.item_rate_card, p, false));
              }
              @Override public void onBindViewHolder(RecyclerView.ViewHolder h, int pos) {
                  h.itemView.startAnimation(AnimationUtils.loadAnimation(ctx, R.anim.item_animation));
                  if (getItemViewType(pos) == TYPE_HEADER) {
                      ((HVH) h).title.setText((String) items.get(pos));
                  } else {
                      DisplayMode m = (DisplayMode) items.get(pos); RVH r = (RVH) h;
                      r.name.setText(m.getRateName()); r.hz.setText(m.getRateInt() + " Hz"); r.desc.setText(m.getRateDesc());
                      r.card.setCardBackgroundColor(colorFor(m.getRateInt()));
                      
                      boolean act = current != null && current.getRateInt() == m.getRateInt();
                      r.card.setCardElevation(act ? 14f : 5f);
                      r.active.setVisibility(act ? View.VISIBLE : View.GONE);
                      r.card.setOnClickListener(v -> { if (listener != null) listener.onClick(m); });
                  }
              }
              private int colorFor(int hz) {
                  if (hz >= 165) return Color.parseColor("#7B1FA2");
                  if (hz >= 144) return Color.parseColor("#1E88E5");
                  if (hz >= 120) return Color.parseColor("#2196F3");
                  if (hz >= 90)  return Color.parseColor("#00ACC1");
                  return Color.parseColor("#00897B");
              }
              static class HVH extends RecyclerView.ViewHolder { TextView title; HVH(View v) { super(v); title = v.findViewById(R.id.tv_header_title); } }
              static class RVH extends RecyclerView.ViewHolder {
                  CardView card; TextView name, hz, desc, active;
                  RVH(View v) { super(v); card=v.findViewById(R.id.card_rate); name=v.findViewById(R.id.tv_rate_name); hz=v.findViewById(R.id.tv_rate_hz); desc=v.findViewById(R.id.tv_rate_desc); active=v.findViewById(R.id.tv_rate_active); }
              }
          }
          EOF

          # ── HomeFragment.java ─────────────────────────────
          cat > app/src/main/java/com/pmahz/fragment/HomeFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.view.*;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.*;
          import android.widget.Toast;
          import com.pmahz.R;
          import com.pmahz.adapter.RateAdapter;
          import com.pmahz.model.DisplayMode;
          import com.pmahz.util.RootUtils;
          import java.util.*;

          public class HomeFragment extends Fragment {
              private RateAdapter adapter;
              private boolean hasRootPermission = false;

              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_home, c, false);
                  RecyclerView rv = v.findViewById(R.id.recycler_rates);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  
                  checkRootStatus();
                  List<Object> items = buildList();
                  adapter = new RateAdapter(getContext(), items, this::apply);
                  rv.setAdapter(adapter);
                  return v;
              }

              private void checkRootStatus() {
                  new Thread(() -> { hasRootPermission = RootUtils.isRooted(); }).start();
              }

              private List<Object> buildList() {
                  DisplayManager dm = (DisplayManager) requireActivity().getSystemService(Context.DISPLAY_SERVICE);
                  android.view.Display d = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY);
                  android.view.Display.Mode[] modes = d.getSupportedModes();
                  Map<String, List<DisplayMode>> grouped = new LinkedHashMap<>();
                  
                  for (android.view.Display.Mode m : modes) {
                      String k = m.getPhysicalWidth() + "x" + m.getPhysicalHeight();
                      grouped.computeIfAbsent(k, x -> new ArrayList<>())
                             .add(new DisplayMode(m.getPhysicalWidth(), m.getPhysicalHeight(), m.getRefreshRate(), m.getModeId()));
                  }
                  
                  List<String> keys = new ArrayList<>(grouped.keySet());
                  keys.sort((a, b) -> {
                      String[] pa = a.split("x"), pb = b.split("x");
                      int resA = Integer.parseInt(pa[0]) * Integer.parseInt(pa[1]);
                      int resB = Integer.parseInt(pb[0]) * Integer.parseInt(pb[1]);
                      return Integer.compare(resB, resA);
                  });
                  
                  if (keys.isEmpty()) return fallback();
                  List<Object> items = new ArrayList<>();
                  for (int i = 0; i < keys.size(); i++) {
                      List<DisplayMode> ms = grouped.get(keys.get(i));
                      ms.sort((a, b) -> Float.compare(b.getRefreshRate(), a.getRefreshRate()));
                      String label = keys.size() == 1
                          ? ms.get(0).getResolutionLabel() + " | 检测到多档硬件帧率"
                          : i == 0 ? "[高分辨率] " + ms.get(0).getResolutionLabel()
                                   : "[低分辨率] " + ms.get(0).getResolutionLabel();
                      items.add(label);
                      items.addAll(ms);
                  }
                  return items;
              }

              private List<Object> fallback() {
                  int[] rs = {60, 90, 120, 144, 170, 175, 177};
                  List<Object> l = new ArrayList<>();
                  l.add("1272x2772 | 已自动探测全域档位");
                  for (int r : rs) l.add(new DisplayMode(1272, 2772, r, -1));
                  return l;
              }

              private void apply(DisplayMode m) {
                  if (!hasRootPermission) {
                      Toast.makeText(getContext(), "未获取root权限", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  new Thread(() -> {
                      boolean ok = RootUtils.setRefreshRate(m.getModeId(), m.getRateInt());
                      requireActivity().runOnUiThread(() -> {
                          if (ok) {
                              adapter.setCurrent(m);
                              Toast.makeText(getContext(), "已成功应用 " + m.getRateInt() + " Hz", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(getContext(), "指令下发未成功，请检查根权限", Toast.LENGTH_LONG).show();
                          }
                      });
                  }).start();
              }
          }
          EOF

          # ── SettingsFragment.java ─────────────────────────
          cat > app/src/main/java/com/pmahz/fragment/SettingsFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.core.content.FileProvider;
          import androidx.fragment.app.Fragment;
          import com.pmahz.R;
          import com.pmahz.util.RootUtils;
          import java.io.*;

          public class SettingsFragment extends Fragment {
              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_settings, c, false);
                  TextView status = v.findViewById(R.id.tv_root_status);
                  TextView authorClick = v.findViewById(R.id.tv_author_about);
                  Button btnLog = v.findViewById(R.id.btn_generate_log);
                  
                  new Thread(() -> {
                      boolean ok = RootUtils.isRooted();
                      if (isAdded() && getActivity() != null) {
                          getActivity().runOnUiThread(() -> {
                              status.setText(ok ? "已获取高级超级用户 Root 权限" : "没有获取 Root 权限");
                              status.setTextColor(Color.parseColor(ok ? "#2ECC71" : "#E74C3C"));
                          });
                      }
                  }).start();

                  authorClick.setOnClickListener(x -> openCoolapk());
                  btnLog.setOnClickListener(x -> generateSystemLog());
                  return v;
              }

              private void openCoolapk() {
                  String url = "https://www.coolapk.com/u/31452988";
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)).setPackage("com.coolapk.market")); }
                  catch (Exception e) { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
              }

              private void generateSystemLog() {
                  new Thread(() -> {
                      try {
                          File logFile = new File(requireContext().getExternalCacheDir(), "refresh_rate_log.txt");
                          Process process = Runtime.getRuntime().exec("logcat -d");
                          BufferedReader bufferedReader = new BufferedReader(new InputStreamReader(process.getInputStream()));
                          StringBuilder log = new StringBuilder();
                          String line;
                          int count = 0;
                          while ((line = bufferedReader.readLine()) != null && count < 200) { 
                              log.append(line).append("\n");
                              count++;
                          }
                          FileWriter writer = new FileWriter(logFile);
                          writer.write(log.toString());
                          writer.close();

                          requireActivity().runOnUiThread(() -> {
                              Toast.makeText(getContext(), "运行日志已生成至缓存目录下", Toast.LENGTH_LONG).show();
                              try {
                                  Uri uri = FileProvider.getUriForFile(requireContext(), "com.pmahz.fileprovider", logFile);
                                  Intent intent = new Intent(Intent.ACTION_SEND);
                                  intent.setType("text/plain");
                                  intent.putExtra(Intent.EXTRA_STREAM, uri);
                                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  startActivity(Intent.createChooser(intent, "分享或保存运行日志"));
                              } catch (Exception e) {
                                  Toast.makeText(getContext(), "日志分享拉取失败", Toast.LENGTH_SHORT).show();
                              }
                          });
                      } catch (IOException e) {
                          requireActivity().runOnUiThread(() -> Toast.makeText(getContext(), "日志捕获失败", Toast.LENGTH_SHORT).show());
                      }
                  }).start();
              }
          }
