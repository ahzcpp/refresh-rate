          package com.pmahz.fragment;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.fragment.app.Fragment;
          import com.pmahz.R;
          import com.pmahz.util.RootUtils;

          public class SettingsFragment extends Fragment {
              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_settings, c, false);
                  TextView status = v.findViewById(R.id.tv_root_status);
                  Button btnFollow = v.findViewById(R.id.btn_follow_coolapk);

                  status.setText("🔄 探测底层硬件环境...");
                  new Thread(() -> {
                      boolean ok = RootUtils.isRooted();
                      if (isAdded() && getActivity() != null) {
                          getActivity().runOnUiThread(() -> {
                              if (ok) {
                                  status.setText("已获取高级超级用户 Root 权限");
                                  status.setTextColor(Color.parseColor("#2ECC71"));
                              } else {
                                  status.setText("没有获取 Root 权限");
                                  status.setTextColor(Color.parseColor("#E74C3C"));
                              }
                          });
                      }
                  }).start();

                  btnFollow.setOnClickListener(x -> {
                      String targetUrl = "https://www.coolapk.com/u/31452988";
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                      intent.setPackage("com.coolapk.market");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                          startActivity(webIntent);
                      }
                  });
                  return v;
              }
          }
