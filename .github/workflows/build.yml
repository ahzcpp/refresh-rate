name: 生成并编译 APK v4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成完整项目源码
        run: |
          mkdir -p app/src/main/java/com/pmahz/fragment
          mkdir -p app/src/main/java/com/pmahz/adapter
          mkdir -p app/src/main/java/com/pmahz/model
          mkdir -p app/src/main/java/com/pmahz/util
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ── settings.gradle ───────────────────────────────
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "屏幕刷新率"
          include ':app'
          EOF

          # ── build.gradle root ─────────────────────────────
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # ── app/build.gradle ──────────────────────────────
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.pmahz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pmahz"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # ── gradle wrapper ────────────────────────────────
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradlew << 'EOF'
          #!/bin/sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ── AndroidManifest.xml ───────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.RefreshRate">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ── 动画定义：列表入场动效 ──────────────────────────
          cat > app/src/main/res/anim/item_animation.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:duration="400">
              <translate
                  android:fromYDelta="15%"
                  android:toYDelta="0"
                  android:interpolator="@android:anim/decelerate_interpolator"/>
              <alpha
                  android:fromAlpha="0.0"
                  android:toAlpha="1.0"
                  android:interpolator="@android:anim/decelerate_interpolator"/>
          </set>
          EOF

          # ── 图标文件生成（保持原样） ────────────────────────
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1A1A1A"/></shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M16,26 Q16,20 22,20 L86,20 Q92,20 92,26 L92,82 Q92,88 86,88 L22,88 Q16,88 16,82 Z"/><path android:fillColor="#1A1A1A" android:pathData="M20,34 L88,34 L88,84 L20,84 Z"/><path android:fillColor="#FF5F57" android:pathData="M26,27 Q26,24 29,24 Q32,24 32,27 Q32,30 29,30 Q26,30 26,27 Z"/><path android:fillColor="#FEBC2E" android:pathData="M37,27 Q37,24 40,24 Q43,24 43,27 Q43,30 40,30 Q37,30 37,27 Z"/><path android:fillColor="#28C840" android:pathData="M48,27 Q48,24 51,24 Q54,24 54,27 Q54,30 51,30 Q48,30 48,27 Z"/><path android:fillColor="#FFFFFF" android:strokeColor="#FFFFFF" android:strokeWidth="2" android:pathData="M28,52 L38,59 L28,66"/><path android:fillColor="#FFFFFF" android:pathData="M43,66 L72,66 L72,70 L43,70 Z"/></vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          # ── DisplayMode.java ──────────────────────────────
          cat > app/src/main/java/com/pmahz/model/DisplayMode.java << 'EOF'
          package com.pmahz.model;
          public class DisplayMode {
              private int width, height, modeId;
              private float refreshRate;
              public DisplayMode(int w, int h, float r, int id) {
                  width=w; height=h; refreshRate=r; modeId=id;
              }
              public int getWidth(){return width;}
              public int getHeight(){return height;}
              public float getRefreshRate(){return refreshRate;}
              public int getModeId(){return modeId;}
              public String getResolutionLabel(){return width+"x"+height;}
              public int getRateInt(){return Math.round(refreshRate);}
              public String getRateName(){
                  int r=getRateInt();
                  if(r>=144)return "高刷";
                  if(r>=120)return "极致";
                  if(r>=90)return "极佳";
                  if(r>=60)return "流畅";
                  return "标准";
              }
              public String getRateDesc(){
                  int r=getRateInt();
                  if(r>=144)return "臻享视界，完美观感";
                  if(r>=120)return "画面流畅动人，舒适体验";
                  if(r>=90)return "提高刷新率，极致体验";
                  if(r>=60)return "较高刷新率，画面流畅";
                  return "常规刷新率，延长续航";
              }
          }
          EOF

          # ── RootUtils.java（修复闪退，加入全Android通用多重策略切换方案） ──
          cat > app/src/main/java/com/pmahz/util/RootUtils.java << 'EOF'
          package com.pmahz.util;
          import android.util.Log;
          import java.io.*;

          public class RootUtils {
              private static final String TAG = "RootUtils";

              public static boolean isRooted() {
                  Process p = null;
                  DataOutputStream os = null;
                  BufferedReader r = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());
                      os.writeBytes("echo RootOK\nexit\n");
                      os.flush();
                      r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String line = r.readLine();
                      return "RootOK".equals(line);
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(r != null) r.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }

              /**
               * 复合切换刷新率方案 - 适合全安卓系统，彻底修复直接退出导致的闪退
               */
              public static boolean setRefreshRate(int hz, int modeId) {
                  Process p = null;
                  DataOutputStream os = null;
                  try {
                      p = Runtime.getRuntime().exec("su");
                      os = new DataOutputStream(p.getOutputStream());

                      // 策略 1: 写入标准 AOSP 系统全局刷新率框架参数
                      os.writeBytes("settings put system peak_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put system min_refresh_rate " + hz + ".0\n");
                      os.writeBytes("settings put secure user_refresh_rate " + hz + "\n");

                      // 策略 2: Android 11+ 标准物理显示控制服务指令
                      os.writeBytes("cmd display set-user-preferred-display-mode " + hz + "\n");

                      // 策略 3: 底层 SurfaceFlinger 备用映射注入 (规避特定版本限制)
                      if (modeId > 0) {
                          os.writeBytes("service call SurfaceFlinger 1035 i32 " + modeId + "\n");
                          os.writeBytes("service call SurfaceFlinger 1035 i32 0\n");
                      }

                      os.writeBytes("exit\n");
                      os.flush();
                      
                      int exitCode = p.waitFor();
                      Log.d(TAG, "刷新率指令下发完成，退出码: " + exitCode);
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "写入刷新率指令失败: " + e.getMessage());
                      return false;
                  } finally {
                      // 严格释放系统流，防止资源泄漏或主进程死锁闪退
                      try { if(os != null) os.close(); } catch(Exception ignored){}
                      try { if(p != null) p.destroy(); } catch(Exception ignored){}
                  }
              }
          }
          EOF

          # ── RateAdapter.java（单列大卡片，加绿色大勾 ✔） ──
          cat > app/src/main/java/com/pmahz/adapter/RateAdapter.java << 'EOF'
          package com.pmahz.adapter;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.*;
          import android.view.animation.AnimationUtils;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;
          import androidx.recyclerview.widget.RecyclerView;
          import com.pmahz.R;
          import com.pmahz.model.DisplayMode;
          import java.util.List;

          public class RateAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              public static final int TYPE_HEADER = 0, TYPE_RATE = 1;
              public interface OnRateClick { void onClick(DisplayMode m); }
              private List<Object> items;
              private Context ctx;
              private OnRateClick listener;
              private DisplayMode current;

              public RateAdapter(Context c, List<Object> i, OnRateClick l) { ctx=c; items=i; listener=l; }
              public void update(List<Object> i) { items=i; notifyDataSetChanged(); }
              public void setCurrent(DisplayMode m) { current=m; notifyDataSetChanged(); }
              @Override public int getItemViewType(int p) { return items.get(p) instanceof String ? TYPE_HEADER : TYPE_RATE; }
              @Override public int getItemCount() { return items==null ? 0 : items.size(); }

              @Override public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                  LayoutInflater inf = LayoutInflater.from(ctx);
                  if (t == TYPE_HEADER) return new HVH(inf.inflate(R.layout.item_res_header, p, false));
                  return new RVH(inf.inflate(R.layout.item_rate_card, p, false));
              }

              @Override public void onBindViewHolder(RecyclerView.ViewHolder h, int pos) {
                  // 添加动态加载动效
                  h.itemView.startAnimation(AnimationUtils.loadAnimation(ctx, R.anim.item_animation));
                  
                  if (getItemViewType(pos) == TYPE_HEADER) {
                      ((HVH) h).title.setText((String) items.get(pos));
                  } else {
                      DisplayMode m = (DisplayMode) items.get(pos);
                      RVH r = (RVH) h;
                      r.name.setText(m.getRateName());
                      r.hz.setText(m.getRateInt() + " Hz");
                      r.desc.setText(m.getRateDesc());
                      r.card.setCardBackgroundColor(colorFor(m.getRateInt()));
                      
                      boolean act = current != null && (current.getModeId() == m.getModeId() || (current.getModeId() == -1 && current.getRateInt() == m.getRateInt()));
                      r.card.setCardElevation(act ? 14f : 5f);
                      r.active.setVisibility(act ? View.VISIBLE : View.GONE);
                      r.card.setOnClickListener(v -> { if (listener != null) listener.onClick(m); });
                  }
              }

              private int colorFor(int hz) {
                  if (hz >= 144) return Color.parseColor("#1E88E5");
                  if (hz >= 120) return Color.parseColor("#2196F3");
                  if (hz >= 90)  return Color.parseColor("#00ACC1");
                  if (hz >= 60)  return Color.parseColor("#00897B");
                  return Color.parseColor("#FFA726");
              }

              static class HVH extends RecyclerView.ViewHolder {
                  TextView title;
                  HVH(View v) { super(v); title = v.findViewById(R.id.tv_header_title); }
              }
              static class RVH extends RecyclerView.ViewHolder {
                  CardView card;
                  TextView name, hz, desc, active;
                  RVH(View v) {
                      super(v);
                      card   = v.findViewById(R.id.card_rate);
                      name   = v.findViewById(R.id.tv_rate_name);
                      hz     = v.findViewById(R.id.tv_rate_hz);
                      desc   = v.findViewById(R.id.tv_rate_desc);
                      active = v.findViewById(R.id.tv_rate_active);
                  }
              }
          }
          EOF

          # ── HomeFragment.java（高分辨率优先展示 + 优雅动画权限弹窗） ──
          cat > app/src/main/java/com/pmahz/fragment/HomeFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AlertDialog;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.*;
          import com.pmahz.R;
          import com.pmahz.adapter.RateAdapter;
          import com.pmahz.model.DisplayMode;
          import com.pmahz.util.RootUtils;
          import java.util.*;

          public class HomeFragment extends Fragment {
              private RateAdapter adapter;
              private boolean hasRootPermission = false;

              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_home, c, false);
                  RecyclerView rv = v.findViewById(R.id.recycler_rates);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  
                  // 异步校验 Root 权限
                  checkRootStatus();

                  List<Object> items = buildList();
                  adapter = new RateAdapter(getContext(), items, this::apply);
                  rv.setAdapter(adapter);
                  return v;
              }

              private void checkRootStatus() {
                  new Thread(() -> {
                      hasRootPermission = RootUtils.isRooted();
                  }).start();
              }

              private List<Object> buildList() {
                  DisplayManager dm = (DisplayManager) requireActivity().getSystemService(Context.DISPLAY_SERVICE);
                  android.view.Display d = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY);
                  android.view.Display.Mode[] modes = d.getSupportedModes();
                  Map<String, List<DisplayMode>> grouped = new LinkedHashMap<>();
                  
                  for (android.view.Display.Mode m : modes) {
                      String k = m.getPhysicalWidth() + "x" + m.getPhysicalHeight();
                      grouped.computeIfAbsent(k, x -> new ArrayList<>())
                             .add(new DisplayMode(m.getPhysicalWidth(), m.getPhysicalHeight(), m.getRefreshRate(), m.getModeId()));
                  }
                  
                  List<String> keys = new ArrayList<>(grouped.keySet());
                  // 调整分辨率排序规则：总像素点从大到小（高分辨率优先放在首位）
                  keys.sort((a, b) -> {
                      String[] pa = a.split("x"), pb = b.split("x");
                      int resA = Integer.parseInt(pa[0]) * Integer.parseInt(pa[1]);
                      int resB = Integer.parseInt(pb[0]) * Integer.parseInt(pb[1]);
                      return Integer.compare(resB, resA);
                  });
                  
                  if (keys.isEmpty()) return fallback();
                  List<Object> items = new ArrayList<>();
                  for (int i = 0; i < keys.size(); i++) {
                      List<DisplayMode> ms = grouped.get(keys.get(i));
                      ms.sort((a, b) -> Float.compare(b.getRefreshRate(), a.getRefreshRate()));
                      String label = keys.size() == 1
                          ? "📱 " + ms.get(0).getResolutionLabel() + " | " + ms.size() + " 档刷新率"
                          : i == 0 ? "✨ 高分辨率  " + ms.get(0).getResolutionLabel()
                                   : "🔋 低分辨率  " + ms.get(0).getResolutionLabel();
                      items.add(label);
                      items.addAll(ms);
                  }
                  return items;
              }

              private List<Object> fallback() {
                  int[] rs = {60, 90, 120, 144, 165};
                  List<Object> l = new ArrayList<>();
                  l.add("📱 1080×2400 | 已为您适配通用物理档位");
                  for (int r : rs) l.add(new DisplayMode(1080, 2400, r, -1));
                  return l;
              }

              private void apply(DisplayMode m) {
                  if (!hasRootPermission) {
                      // 拦截并触发高颜值无权限动画弹窗
                      showNoRootDialog();
                      return;
                  }
                  new Thread(() -> {
                      boolean ok = RootUtils.setRefreshRate(m.getRateInt(), m.getModeId());
                      requireActivity().runOnUiThread(() -> {
                          if (ok) {
                              adapter.setCurrent(m);
                              Toast.makeText(getContext(), "✅ 已成功调节至 " + m.getRateInt() + " Hz", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(getContext(), "❌ 切换失败，请检查底层接口支持", Toast.LENGTH_LONG).show();
                          }
                      });
                  }).start();
              }

              private void showNoRootDialog() {
                  if (getContext() == null) return;
                  AlertDialog dialog = new AlertDialog.Builder(getContext(), android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle("🔒 权限受阻")
                      .setMessage("没有获取root权限，请赋予root权限之后再选择切换。")
                      .setPositiveButton("我知道了", (d, w) -> {
                          d.dismiss();
                          checkRootStatus(); // 顺便重新静默尝试申请
                      })
                      .create();
                  
                  if (dialog.getWindow() != null) {
                      // 赋予弹窗优雅的缩放淡入过渡动画
                      dialog.getWindow().getAttributes().windowAnimations = android.R.style.Animation_Dialog;
                  }
                  dialog.show();
              }
          }
          EOF

          # ── SettingsFragment.java（直观权限感应 + 酷安直达） ─────────────────
          cat > app/src/main/java/com/pmahz/fragment/SettingsFragment.java << 'EOF'
          package com.pmahz.fragment;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.fragment.app.Fragment;
          import com.pmahz.R;
          import com.pmahz.util.RootUtils;

          public class SettingsFragment extends Fragment {
              @Override public View onCreateView(LayoutInflater inf, ViewGroup c, Bundle s) {
                  View v = inf.inflate(R.layout.fragment_settings, c, false);
                  TextView status = v.findViewById(R.id.tv_root_status);
                  Button btnFollow = v.findViewById(R.id.btn_follow_coolapk);

                  // 全自动静默识别 Root 权限归属状态
                  status.setText("🔄 正在感知底层环境...");
                  new Thread(() -> {
                      boolean ok = RootUtils.isRooted();
                      if (isAdded() && getActivity() != null) {
                          getActivity().runOnUiThread(() -> {
                              if (ok) {
                                  status.setText("已获取 Root 超级用户权限");
                                  status.setTextColor(Color.parseColor("#2ECC71")); // 绿色标签
                              } else {
                                  status.setText("未获取 Root 权限 (受限模式)");
                                  status.setTextColor(Color.parseColor("#E74C3C")); // 红色标签
                              }
                          });
                      }
                  }).start();

                  // 酷安跳转核心逻辑
                  btnFollow.setOnClickListener(x -> {
                      String targetUrl = "https://www.coolapk.com/u/31452988";
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                      intent.setPackage("com.coolapk.market"); // 锁定打开目标包名
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          startActivity(intent);
                      } catch (Exception e) {
                          // 降级兜底方案：如果没有安装酷安，自动拉起系统浏览器
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(targetUrl));
                          startActivity(webIntent);
                      }
                  });

                  return v;
              }
          }
          EOF

          # ── MainActivity.java ─────────────────────────────
          cat > app/src/main/java/com/pmahz/MainActivity.java << 'EOF'
          package com.pmahz;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.fragment.app.Fragment;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.pmahz.fragment.HomeFragment;
          import com.pmahz.fragment.SettingsFragment;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_main);
                  BottomNavigationView nav = findViewById(R.id.bottom_navigation);
                  if (s == null) load(new HomeFragment());
                  nav.setOnItemSelectedListener(item -> {
                      if (item.getItemId() == R.id.nav_home)     { load(new HomeFragment());     return true; }
                      if (item.getItemId() == R.id.nav_settings) { load(new SettingsFragment()); return true; }
                      return false;
                  });
              }
              void load(Fragment f) {
                  getSupportFragmentManager().beginTransaction().replace(R.id.fragment_container, f).commit();
              }
          }
          EOF

          # ── activity_main.xml ─────────────────────────────
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent">
              <FrameLayout android:id="@+id/fragment_container" android:layout_width="0dp" android:layout_height="0dp" app:layout_constraintTop_toTopOf="parent" app:layout_constraintBottom_toTopOf="@id/bottom_navigation" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent"/>
              <com.google.android.material.bottomnavigation.BottomNavigationView android:id="@+id/bottom_navigation" android:layout_width="0dp" android:layout_height="wrap_content" app:layout_constraintBottom_toBottomOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintEnd_toEndOf="parent" app:menu="@menu/bottom_nav_menu" android:background="@android:color/white"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # ── fragment_home.xml ─────────────────────────────
          cat > app/src/main/res/layout/fragment_home.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#F0F4FF">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:paddingStart="20dp" android:paddingEnd="20dp" android:paddingTop="20dp" android:paddingBottom="12dp" android:background="#FFFFFF">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="屏幕刷新率" android:textSize="28sp" android:textStyle="bold" android:textColor="#1A1A2E"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="点击精细化调节硬件面板帧数" android:textSize="13sp" android:textColor="#888888"/>
              </LinearLayout>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/recycler_rates" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:paddingStart="14dp" android:paddingEnd="14dp" android:paddingTop="8dp" android:paddingBottom="8dp" android:clipToPadding="false"/>
          </LinearLayout>
          EOF

          # ── item_rate_card.xml（大卡片，大大的绿色对勾 ✔） ──
          cat > app/src/main/res/layout/item_rate_card.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:paddingTop="6dp" android:paddingBottom="2dp">
              <androidx.cardview.widget.CardView android:id="@+id/card_rate" android:layout_width="match_parent" android:layout_height="110dp" app:cardCornerRadius="20dp" app:cardElevation="5dp">
                  <RelativeLayout android:layout_width="match_parent" android:layout_height="match_parent" android:padding="18dp">
                      <TextView android:id="@+id/tv_rate_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="15sp" android:textColor="#DDEEFF" android:layout_alignParentStart="true" android:layout_alignParentTop="true"/>
                      
                      <!-- 绿色大√ 样式状态栏 -->
                      <TextView android:id="@+id/tv_rate_active" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="✔ 当前" android:textSize="14sp" android:textStyle="bold" android:textColor="#00E676" android:background="#33000000" android:paddingStart="12dp" android:paddingEnd="12dp" android:paddingTop="4dp" android:paddingBottom="4dp" android:layout_alignParentEnd="true" android:layout_alignParentTop="true" android:visibility="gone"/>
                      
                      <TextView android:id="@+id/tv_rate_hz" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="36sp" android:textStyle="bold" android:textColor="#FFFFFF" android:layout_below="@id/tv_rate_name" android:layout_marginTop="2dp"/>
                      <TextView android:id="@+id/tv_rate_desc" android:layout_width="match_parent" android:layout_height="wrap_content" android:textSize="12sp" android:textColor="#CCDDFF" android:layout_alignParentBottom="true" android:maxLines="1"/>
                  </RelativeLayout>
              </androidx.cardview.widget.CardView>
          </LinearLayout>
          EOF

          # ── item_res_header.xml ───────────────────────────
          cat > app/src/main/res/layout/item_res_header.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:paddingStart="4dp" android:paddingEnd="10dp" android:paddingTop="16dp" android:paddingBottom="4dp" android:gravity="center_vertical">
              <View android:layout_width="4dp" android:layout_height="22dp" android:background="#1976D2" android:layout_marginEnd="10dp"/>
              <TextView android:id="@+id/tv_header_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textSize="15sp" android:textStyle="bold" android:textColor="#333355"/>
          </LinearLayout>
          EOF

          # ── fragment_settings.xml ─────────────────────────
          cat > app/src/main/res/layout/fragment_settings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F0F4FF">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="设置" android:textSize="28sp" android:textStyle="bold" android:textColor="#1A1A2E" android:paddingBottom="16dp"/>
                  
                  <androidx.cardview.widget.CardView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="12dp" app:cardCornerRadius="16dp" app:cardElevation="4dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔑  环境诊断" android:textSize="16sp" android:textStyle="bold" android:textColor="#1976D2" android:paddingBottom="12dp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="当前 Root 状态：" android:textSize="14sp" android:textColor="#888888"/>
                          <TextView android:id="@+id/tv_root_status" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="探测中..." android:textSize="18sp" android:textStyle="bold" android:layout_marginTop="4dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
                  
                  <androidx.cardview.widget.CardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardCornerRadius="16dp" app:cardElevation="4dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ℹ️  关于" android:textSize="16sp" android:textStyle="bold" android:textColor="#1976D2" android:paddingBottom="8dp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="开发者: 爱好者ahh" android:textSize="15sp" android:textStyle="bold" android:textColor="#222222"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="版本：1.3\n包名：com.pmahz\n支持多重命令集复合无缝调节" android:textSize="13sp" android:textColor="#666666" android:layout_marginTop="4dp" android:lineSpacingExtra="4dp"/>
                          
                          <com.google.android.material.button.MaterialButton android:id="@+id/btn_follow_coolapk" android:layout_width="match_parent" android:layout_height="48dp" android:text="前往关注" android:layout_marginTop="16dp" app:backgroundTint="#11B96B" app:cornerRadius="12dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
              </LinearLayout>
          </ScrollView>
          EOF

          # ── menu ──────────────────────────────────────────
          cat > app/src/main/res/menu/bottom_nav_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_home" android:icon="@android:drawable/ic_menu_gallery" android:title="主页"/>
              <item android:id="@+id/nav_settings" android:icon="@android:drawable/ic_menu_preferences" android:title="设置"/>
          </menu>
          EOF

          # ── values ────────────────────────────────────────
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#1976D2</color>
              <color name="primary_dark">#1565C0</color>
              <color name="accent">#42A5F5</color>
              <color name="white">#FFFFFFFF</color>
              <color name="black">#FF000000</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">屏幕刷新率</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RefreshRate" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
              </style>
          </resources>
          EOF

          echo "✅ 所有规范源码重组完毕！"

      - name: 设置 Android SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 编译 APK
        run: gradle assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 屏幕刷新率-v1.3-爱好者ahh定制版-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
