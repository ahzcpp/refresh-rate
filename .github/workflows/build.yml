                  sbAlpha.setProgress((int)(prefs.getFloat("wallpaper_alpha", 0.3f) * 100));
                  sbCardAlpha.setProgress(prefs.getInt("card_alpha", 0));
                  sbSettingCardAlpha.setProgress(prefs.getInt("setting_card_alpha", 0));
                  sbSettingTextAlpha.setProgress(prefs.getInt("setting_text_alpha", 0));

                  rgWallpaper.setOnCheckedChangeListener((group, checkedId) -> {
                      int type;
                      if (checkedId == R.id.rb_gradient2) type = 1;
                      else if (checkedId == R.id.rb_gradient3) type = 2;
                      else if (checkedId == R.id.rb_custom) type = 3;
                      else if (checkedId == R.id.rb_black) type = 5;
                      else type = 4;
                      prefs.edit().putInt("wallpaper_type", type).apply();
                      if (type == 3 && prefs.getString("wallpaper_uri", null) == null) {
                          Toast.makeText(getContext(), "请先选择自定义图片", Toast.LENGTH_SHORT).show();
                      }
                  });

                  sbAlpha.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          prefs.edit().putFloat("wallpaper_alpha", progress / 100f).apply();
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });

                  sbCardAlpha.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          prefs.edit().putInt("card_alpha", progress).apply();
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });

                  SeekBar.OnSeekBarChangeListener settingTransparencyListener = new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          applySettingTransparency();
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {
                          prefs.edit()
                              .putInt("setting_card_alpha", sbSettingCardAlpha.getProgress())
                              .putInt("setting_text_alpha", sbSettingTextAlpha.getProgress())
                              .apply();
                      }
                  };
                  sbSettingCardAlpha.setOnSeekBarChangeListener(settingTransparencyListener);
                  sbSettingTextAlpha.setOnSeekBarChangeListener(settingTransparencyListener);

                  applySettingTransparency();

                  pickImageLauncher = registerForActivityResult(
                          new ActivityResultContracts.StartActivityForResult(),
                          result -> {
                              if (result.getResultCode() == getActivity().RESULT_OK && result.getData() != null) {
                                  Uri uri = result.getData().getData();
                                  if (uri != null) {
                                      prefs.edit().putString("wallpaper_uri", uri.toString()).apply();
                                      rgWallpaper.check(R.id.rb_custom);
                                      Toast.makeText(getContext(), R.string.custom_wallpaper_saved, Toast.LENGTH_SHORT).show();
                                  }
                              }
                          }
                  );

                  btnCustomWallpaper.setOnClickListener(view -> {
                      String permission = Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES : Manifest.permission.READ_EXTERNAL_STORAGE;
                      if (ContextCompat.checkSelfPermission(requireActivity(), permission) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{permission}, 100);
                      } else {
                          openGallery();
                      }
                  });

                  return v;
              }

              private void updateShizukuStatus(TextView tv, Button btn) {
                  boolean avail = com.pmahz.util.ShizukuUtils.isAvailable();
                  boolean perm  = com.pmahz.util.ShizukuUtils.hasPermission();
                  if (!avail) {
                      tv.setText("Shizuku 未运行（需先安装启动）");
                      tv.setTextColor(0xFF888888);
                      btn.setVisibility(android.view.View.GONE);
                  } else if (!perm) {
                      tv.setText("Shizuku 运行中，未授权");
                      tv.setTextColor(0xFFE74C3C);
                      btn.setVisibility(android.view.View.VISIBLE);
                  } else {
                      tv.setText("✅ Shizuku 已授权，可切换刷新率");
                      tv.setTextColor(0xFF2ECC71);
                      btn.setVisibility(android.view.View.GONE);
                  }
              }

              private void applySettingTransparency() {
                  if (rootView == null) return;
                  int cardAlpha = 255 - (int)(sbSettingCardAlpha.getProgress() / 100f * 255);
                  int textAlpha = 255 - (int)(sbSettingTextAlpha.getProgress() / 100f * 255);
                  applyAlphaToViewGroup((ViewGroup) rootView, cardAlpha, textAlpha);
              }

              private void applyAlphaToViewGroup(ViewGroup parent, int cardAlpha, int textAlpha) {
                  for (int i = 0; i < parent.getChildCount(); i++) {
                      View child = parent.getChildAt(i);
                      if (child instanceof CardView) {
                          ((CardView) child).setCardBackgroundColor(Color.argb(cardAlpha, 255, 255, 255));
                      } else if (child instanceof TextView) {
                          child.setAlpha(textAlpha / 255f);
                      }
                      if (child instanceof ViewGroup) {
                          applyAlphaToViewGroup((ViewGroup) child, cardAlpha, textAlpha);
                      }
                  }
              }

              private void openGallery() {
                  Intent intent = new Intent(Intent.ACTION_PICK);
                  intent.setType("image/*");
                  pickImageLauncher.launch(intent);
              }

              @Override public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  if (requestCode == 100) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          openGallery();
                      } else {
                          if (!shouldShowRequestPermissionRationale(permissions[0])) {
                              new AlertDialog.Builder(getContext())
                                      .setTitle(R.string.permission_denied_title)
                                      .setMessage(R.string.permission_denied_message)
                                      .setPositiveButton(R.string.permission_go_settings, (d, w) -> {
                                          Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                                          intent.setData(Uri.parse("package:" + requireActivity().getPackageName()));
                                          startActivity(intent);
                                      })
                                      .setNegativeButton(R.string.permission_cancel, null)
                                      .show();
                          } else {
                              Toast.makeText(getContext(), R.string.need_storage_permission, Toast.LENGTH_SHORT).show();
                          }
                      }
                  }
              }

              private void showLogDialog(String logContent) {
                  if (getContext() == null) return;
                  ScrollView sv = new ScrollView(getContext());
                  TextView tv = new TextView(getContext());
                  tv.setText(logContent);
                  tv.setPadding(30, 30, 30, 30);
                  tv.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 12);
                  tv.setTextColor(Color.BLACK);
                  sv.addView(tv);
                  new AlertDialog.Builder(getContext())
                          .setTitle(R.string.log_dialog_title)
                          .setView(sv)
                          .setPositiveButton(R.string.log_dialog_close, null)
                          .setNeutralButton(R.string.log_dialog_share, (d, w) -> {
                              Intent share = new Intent(Intent.ACTION_SEND);
                              share.setType("text/plain");
                              share.putExtra(Intent.EXTRA_TEXT, logContent);
                              startActivity(Intent.createChooser(share, getString(R.string.log_dialog_share)));
                          })
                          .show();
              }
          }
          EOF

          cat > app/src/main/java/com/pmahz/MainActivity.java << 'EOF'
          package com.pmahz;

          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.fragment.app.Fragment;
          import androidx.fragment.app.FragmentTransaction;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.pmahz.fragment.HomeFragment;
          import com.pmahz.fragment.SettingsFragment;
          import com.pmahz.util.LanguageUtils;
          import java.io.InputStream;
          import androidx.appcompat.app.AppCompatDelegate;

          public class MainActivity extends AppCompatActivity implements SharedPreferences.OnSharedPreferenceChangeListener {
              private ImageView wallpaperView;
              private BottomNavigationView bottomNav;
              private SharedPreferences prefs;

              @Override protected void onCreate(Bundle s) {
              AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO);
               super.onCreate(s);
                  LanguageUtils.applyLanguage(this);
                  setContentView(R.layout.activity_main);
                  
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
              getWindow().setStatusBarColor(android.graphics.Color.TRANSPARENT);
              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
              getWindow().getDecorView().setSystemUiVisibility(
              android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
             );
          }

                  wallpaperView = findViewById(R.id.global_wallpaper);
                  bottomNav = findViewById(R.id.bottom_navigation);

                  prefs = getSharedPreferences("s", MODE_PRIVATE);
                  prefs.registerOnSharedPreferenceChangeListener(this);
                  applyWallpaperAndUI();

                  if (s == null) {
                      loadFragment(new HomeFragment(), false);
                  }
                  bottomNav.setOnItemSelectedListener(item -> {
                      if (item.getItemId() == R.id.nav_home) {
                          loadFragment(new HomeFragment(), false);
                          return true;
                      }
                      if (item.getItemId() == R.id.nav_settings) {
                          loadFragment(new SettingsFragment(), true);
                          return true;
                      }
                      return false;
                  });
              }

              private void loadFragment(Fragment fragment, boolean toSettings) {
                  FragmentTransaction ft = getSupportFragmentManager().beginTransaction();
                  if (toSettings) {
                      ft.setCustomAnimations(R.anim.slide_in_right, R.anim.slide_out_left);
                  } else {
                      ft.setCustomAnimations(R.anim.slide_in_left, R.anim.slide_out_right);
                  }
                  ft.replace(R.id.fragment_container, fragment).commit();
              }

              private void applyWallpaperAndUI() {
                  int type = prefs.getInt("wallpaper_type", 4);
                  float wallpaperAlpha = prefs.getFloat("wallpaper_alpha", 0.3f);
                  wallpaperView.setAlpha(wallpaperAlpha);

                  float titleAlpha = 1f - wallpaperAlpha;
                  bottomNav.getBackground().setAlpha((int)(titleAlpha * 255));
                  bottomNav.setElevation(0);

                  if (type == 3) {
                      String uriStr = prefs.getString("wallpaper_uri", null);
                      if (uriStr != null) {
                          try {
                              InputStream is = getContentResolver().openInputStream(Uri.parse(uriStr));
                              Bitmap bitmap = BitmapFactory.decodeStream(is);
                              wallpaperView.setImageBitmap(bitmap);
                          } catch (Exception e) {
                              wallpaperView.setImageResource(R.drawable.wallpaper_white);
                          }
                      } else {
                          wallpaperView.setImageResource(R.drawable.wallpaper_white);
                      }
                  } else {
                      int resId;
                      if (type == 1) resId = R.drawable.wallpaper_gradient_2;
                      else if (type == 2) resId = R.drawable.wallpaper_gradient_3;
                      else if (type == 5) resId = R.drawable.wallpaper_black;
                      else resId = R.drawable.wallpaper_white;
                      wallpaperView.setImageResource(resId);
                  }
              }

              @Override public void onSharedPreferenceChanged(SharedPreferences sharedPreferences, String key) {
                  if (key.startsWith("wallpaper_")) {
                      applyWallpaperAndUI();
                  }
              }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  prefs.unregisterOnSharedPreferenceChangeListener(this);
              }
          }
