                  boolean av = com.pmahz.util.ShizukuUtils.isAvailable();
                  boolean pe = com.pmahz.util.ShizukuUtils.hasPermission();
                  if (!av) {
                      String full = getString(R.string.shizuku_not_running);
                      SpannableString sp = new SpannableString(full);
                      int end = full.indexOf("（");
                      if (end == -1) end = full.length();
