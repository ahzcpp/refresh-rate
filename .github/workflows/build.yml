                      <TextView android:id="@+id/tv_rate_desc"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="#EEEEEE" android:layout_alignParentBottom="true"/>
                  </RelativeLayout>
              </com.google.android.material.card.MaterialCardView>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_res_header.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:padding="10dp" android:background="@android:color/transparent">
              <TextView android:id="@+id/tv_header_title"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textStyle="bold" android:textColor="@color/text_dark"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/fragment_settings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@android:color/transparent" android:fitsSystemWindows="true">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:padding="16dp">

                  <!-- 授权状态卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/settings_root_title" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"
                              android:paddingBottom="12dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="horizontal" android:gravity="center_vertical">
                              <ImageView android:layout_width="28dp" android:layout_height="28dp"
                                  android:src="@drawable/ic_magisk" android:layout_marginEnd="10dp"/>
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                  android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="@string/root_running_label" android:textSize="15sp"
                                      android:textColor="@color/text_dark"/>
                                  <TextView android:id="@+id/tv_root_status"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="检测中..." android:textSize="12sp"
                                      android:textColor="@color/text_muted"/>
                              </LinearLayout>
                              <com.google.android.material.switchmaterial.SwitchMaterial android:id="@+id/switch_root"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                          <View android:layout_width="match_parent" android:layout_height="1dp"
                              android:background="#22000000" android:layout_marginTop="14dp" android:layout_marginBottom="14dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="horizontal" android:gravity="center_vertical">
                              <ImageView android:layout_width="28dp" android:layout_height="28dp"
                                  android:src="@drawable/ic_shizuku" android:layout_marginEnd="10dp"/>
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                  android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="@string/shizuku_running_label" android:textSize="15sp"
                                      android:textColor="@color/text_dark"/>
                                  <TextView android:id="@+id/tv_shizuku_status"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="检测中..." android:textSize="12sp"
                                      android:textColor="@color/text_muted"/>
                              </LinearLayout>
                              <com.google.android.material.switchmaterial.SwitchMaterial android:id="@+id/switch_shizuku"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                          <Button android:id="@+id/btn_request_shizuku"
                              android:layout_width="match_parent" android:layout_height="48dp"
                              android:text="授权 Shizuku" android:layout_marginTop="10dp" android:visibility="gone"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"/>
                          <View android:layout_width="match_parent" android:layout_height="1dp"
                              android:background="#22000000" android:layout_marginTop="14dp" android:layout_marginBottom="14dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="horizontal" android:gravity="center_vertical">
                              <ImageView android:layout_width="28dp" android:layout_height="28dp"
                                  android:src="@drawable/ic_adb" android:layout_marginEnd="10dp"/>
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                                  android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="@string/adb_running_label" android:textSize="15sp"
                                      android:textColor="@color/text_dark"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:text="@string/adb_desc" android:textSize="11sp"
                                      android:textColor="@color/text_muted"/>
                              </LinearLayout>
                              <com.google.android.material.switchmaterial.SwitchMaterial android:id="@+id/switch_adb"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- ADB 命令卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/adb_title" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"/>
                          <TextView android:id="@+id/tv_adb_status"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/adb_not_running" android:textSize="13sp"
                              android:layout_marginTop="6dp"
                              android:textColor="@color/text_muted"/>
                          <LinearLayout android:id="@+id/adb_command_group"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:orientation="vertical">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="@string/adb_cmd_label" android:textSize="13sp"
                                  android:textColor="@color/text_dark" android:layout_marginTop="10dp"/>
                              <TextView android:id="@+id/tv_adb_cmd"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:padding="10dp" android:background="#22000000"
                                  android:textIsSelectable="true" android:textSize="12sp"
                                  android:fontFamily="monospace" android:layout_marginTop="4dp"/>
                              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:layout_marginTop="8dp">
                                  <Button android:id="@+id/btn_adb_copy"
                                      android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:layout_marginEnd="4dp"
                                      android:text="@string/adb_copy"
                                      style="@style/Widget.MaterialComponents.Button.OutlinedButton"/>
                                  <Button android:id="@+id/btn_adb_check"
                                      android:layout_width="0dp" android:layout_height="wrap_content"
                                      android:layout_weight="1" android:layout_marginStart="4dp"
                                      android:text="@string/adb_check"
                                      style="@style/Widget.MaterialComponents.Button.OutlinedButton"/>
                              </LinearLayout>
                          </LinearLayout>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- 壁纸美化卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/settings_wallpaper_title" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"/>
                          <RadioGroup android:id="@+id/rg_wallpaper"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:layout_marginTop="8dp">
                              <RadioButton android:id="@+id/rb_white" android:text="@string/wallpaper_white"/>
                              <RadioButton android:id="@+id/rb_black" android:text="@string/wallpaper_black"/>
                              <RadioButton android:id="@+id/rb_gradient1" android:text="@string/wallpaper_gradient1"/>
                              <RadioButton android:id="@+id/rb_gradient2" android:text="@string/wallpaper_gradient2"/>
                              <RadioButton android:id="@+id/rb_gradient3" android:text="@string/wallpaper_gradient3"/>
                              <RadioButton android:id="@+id/rb_custom" android:text="@string/wallpaper_custom"/>
                          </RadioGroup>
                          <Button android:id="@+id/btn_custom_wallpaper"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:text="@string/wallpaper_choose_image" android:layout_marginTop="4dp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/wallpaper_alpha_label" android:layout_marginTop="12dp"
                              android:textColor="@color/text_dark"/>
                          <SeekBar android:id="@+id/sb_alpha"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:max="100" android:progress="30"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- 档位显示卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/card_display_title" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/card_alpha_label" android:layout_marginTop="12dp"
                              android:textColor="@color/text_dark"/>
                          <SeekBar android:id="@+id/sb_card_alpha"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:max="100" android:progress="0"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- 设置页美化卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/settings_page_beautify" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/settings_card_alpha" android:layout_marginTop="12dp"
                              android:textColor="@color/text_dark"/>
                          <SeekBar android:id="@+id/sb_setting_card_alpha"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:max="100" android:progress="0"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/settings_text_alpha" android:layout_marginTop="12dp"
                              android:textColor="@color/text_dark"/>
                          <SeekBar android:id="@+id/sb_setting_text_alpha"
                              android:layout_width="match_parent" android:layout_height="wrap_content"
                              android:max="100" android:progress="0"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- 关于卡片 -->
                  <androidx.cardview.widget.CardView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:layout_marginBottom="16dp"
                      app:cardCornerRadius="12dp" app:cardBackgroundColor="#AAFFFFFF">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/about_title" android:textStyle="bold"
                              android:textSize="18sp" android:textColor="@color/text_dark"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:text="@string/version_label" android:layout_marginTop="4dp"
                              android:textColor="@color/text_dark"/>
                          <TextView android:id="@+id/tv_author"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:textColor="#1976D2" android:layout_marginTop="4dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <Button android:id="@+id/btn_generate_log"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="@string/generate_log_btn"
                      style="@style/Widget.MaterialComponents.Button"/>
              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/res/menu/bottom_nav_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_home" android:icon="@drawable/ic_nav_home" android:title="@string/nav_home"/>
              <item android:id="@+id/nav_settings" android:icon="@drawable/ic_nav_settings" android:title="@string/nav_settings"/>
          </menu>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#1976D2</color>
              <color name="primary_dark">#1565C0</color>
              <color name="accent">#42A5F5</color>
              <color name="white">#FFFFFFFF</color>
              <color name="black">#FF000000</color>
              <color name="bg_main">#F0F4FF</color>
              <color name="text_dark">#1A1A2E</color>
              <color name="text_muted">#888888</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RefreshRate" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF
          SCRIPTEOF
          chmod +x generate.sh
          ./generate.sh

      - name: 4. 用官方标准 Action 建立合规的 Gradle 包装器
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
          generate-job-summary: true

      - name: 5. 编译生成 Debug APK
        run: gradle assembleDebug

      - name: 6. 提炼并分发 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: RefreshRate-v1.6.1
          path: app/build/outputs/apk/debug/app-debug.apk
