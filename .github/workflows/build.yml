                      tv.setText(R.string.shizuku_running_no_permission);
                      tv.setTextColor(0xFFE74C3C);
                      btn.setVisibility(View.VISIBLE);
                  } else {
                      tv.setText(R.string.shizuku_granted);
                      tv.setTextColor(0xFF2ECC71);
                      btn.setVisibility(View.GONE);
                  }
              }
              private void applySettingTransparency() {
                  if (rootView == null) return;
                  int ca = 255 - (int)(sbSettingCardAlpha.getProgress()/100f * 255);
                  int ta = 255 - (int)(sbSettingTextAlpha.getProgress()/100f * 255);
                  applyAlpha((ViewGroup) rootView, ca, ta);
              }
              private void applyAlpha(ViewGroup p, int ca, int ta) {
                  for (int i=0; i<p.getChildCount(); i++) {
                      View c = p.getChildAt(i);
                      if (c instanceof CardView) ((CardView)c).setCardBackgroundColor(Color.argb(ca, 255, 255, 255));
                      else if (c instanceof TextView) c.setAlpha(ta/255f);
                      if (c instanceof ViewGroup) applyAlpha((ViewGroup)c, ca, ta);
                  }
              }
              private void openGallery() {
                  Intent i = new Intent(Intent.ACTION_PICK); i.setType("image/*"); pickImageLauncher.launch(i);
              }
              @Override public void onRequestPermissionsResult(int rc, @NonNull String[] p, @NonNull int[] r) {
                  if (rc == 100) {
                      if (r.length>0 && r[0]==PackageManager.PERMISSION_GRANTED) openGallery();
                      else if (!shouldShowRequestPermissionRationale(p[0])) {
                          new AlertDialog.Builder(getContext())
                              .setTitle(R.string.permission_denied_title)
                              .setMessage(R.string.permission_denied_message)
                              .setPositiveButton(R.string.permission_go_settings, (d, w) -> {
                                  Intent it = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                                  it.setData(Uri.parse("package:" + requireActivity().getPackageName()));
                                  startActivity(it);
                              }).setNegativeButton(R.string.permission_cancel, null).show();
                      } else Toast.makeText(getContext(), R.string.need_storage_permission, Toast.LENGTH_SHORT).show();
                  }
              }
              private void showLogDialog(String log) {
                  if (getContext() == null) return;
                  ScrollView sv = new ScrollView(getContext());
                  TextView tv = new TextView(getContext());
                  tv.setText(log); tv.setPadding(30, 30, 30, 30);
                  tv.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 12);
                  tv.setTextColor(Color.BLACK);
                  sv.addView(tv);
                  new AlertDialog.Builder(getContext())
                      .setTitle(R.string.log_dialog_title).setView(sv)
                      .setPositiveButton(R.string.log_dialog_close, null)
                      .setNeutralButton(R.string.log_dialog_share, (d, w) -> {
                          Intent sh = new Intent(Intent.ACTION_SEND);
                          sh.setType("text/plain"); sh.putExtra(Intent.EXTRA_TEXT, log);
                          startActivity(Intent.createChooser(sh, getString(R.string.log_dialog_share)));
                      }).show();
              }
          }
